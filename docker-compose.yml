# WARNING: This base config is for local development. It serves the app over
# plaintext HTTP (no TLS), so credentials and JWTs travel unencrypted. For
# production, layer docker-compose.prod.yml on top (PAD_BEHIND_PROXY=true behind
# a TLS-terminating proxy) — never deploy this file on its own.
services:
  app:
    build: .
    ports:
      # Loopback only: this stack serves plaintext HTTP (see the warning above),
      # so credentials must not be reachable from the LAN. Caddy in the prod
      # overlay reaches the app over the compose network, not through this port.
      - "127.0.0.1:${PAD_PORT:-8080}:${PAD_PORT:-8080}"
    environment:
      # The container must listen on the port the mapping above publishes. The
      # image defaults PAD_PORT to 8080 and this was never passed through, so
      # setting PAD_PORT in .env published a port nothing listened on.
      - PAD_PORT=${PAD_PORT:-8080}
      # baki_app, NOT postgres: a superuser (or any BYPASSRLS role) ignores
      # every Row-Level Security policy in the schema, which silently disables
      # the second of the two tenant-isolation layers. scripts/db-init creates
      # this role on first volume init. See that file for existing deployments.
      #
      # The password here is the local-dev default of BAKI_APP_PASSWORD (see the
      # db service below) and the two must agree. Compose cannot interpolate a
      # variable inside another variable's default, so setting BAKI_APP_PASSWORD
      # means setting PAD_DATABASE_URL to match — which a real deployment does
      # anyway, since docker-compose.prod.yml requires both explicitly.
      - PAD_DATABASE_URL=${PAD_DATABASE_URL:-postgres://baki_app:baki_app@db:5432/baki?sslmode=disable}
      # LOCAL DEVELOPMENT ONLY. The image ships PAD_MODE=cloud, and cloud mode
      # defaults to requiring TLS on the database connection — so without this
      # the app REFUSES TO START against the db service below, which serves no
      # TLS at all. sslmode=prefer does not help: it is not in the accepted set
      # (only require/verify-ca/verify-full are), and sslmode=require fails at
      # the handshake because the server has no certificate.
      #
      # docker-compose.prod.yml sets PAD_DB_REQUIRE_SSL=true explicitly so a
      # production stack can never inherit this relaxation. If you point this
      # base file at a real database, drop this line and use sslmode=require.
      - PAD_DB_REQUIRE_SSL=false
      - PAD_AUTH_SECRET=${PAD_AUTH_SECRET:?PAD_AUTH_SECRET must be set}
      # The keystore key (docs/architecture/operations.md, "Encryption keys"). Unset,
      # PAD_AUTH_SECRET keys the stored provider keys, which the cloud image logs as
      # deprecated. To move off it, set both in .env: a new PAD_ENCRYPTION_KEY
      # (openssl rand -hex 32) and PAD_ENCRYPTION_KEY_PREVIOUS = the PAD_AUTH_SECRET
      # value; the boot re-seals, then drop PAD_ENCRYPTION_KEY_PREVIOUS. Empty = unset.
      - PAD_ENCRYPTION_KEY=${PAD_ENCRYPTION_KEY:-}
      - PAD_ENCRYPTION_KEY_PREVIOUS=${PAD_ENCRYPTION_KEY_PREVIOUS:-}
      # Both loopback spellings: on Windows, `localhost` resolves to ::1 first,
      # and browsers reach the container through WSL's relay there (which can
      # stall); http://127.0.0.1:8080 goes through Docker's own forwarder.
      - PAD_ALLOWED_ORIGINS=${PAD_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      # GLM provider base URL. The default targets z.ai's pay-as-you-go
      # endpoint; a GLM Coding Plan key is only entitled to the coding
      # endpoint and gets rejected there (surfacing as an "insufficient
      # balance" chat error). See GLM_API_URL in .env.
      - GLM_API_URL=${GLM_API_URL:-}
      # Azure AI Foundry endpoint allow-list extras and the private-egress
      # override (see .env.example). Empty = defaults.
      - PAD_AZURE_FOUNDRY_ALLOWED_HOSTS=${PAD_AZURE_FOUNDRY_ALLOWED_HOSTS:-}
      - PAD_AI_ALLOW_PRIVATE_EGRESS=${PAD_AI_ALLOW_PRIVATE_EGRESS:-}
      # Knowledge-base embedding width and provider pin (see .env.example;
      # PAD_EMBEDDING_PROVIDER=azure-foundry is the only way the knowledge
      # base embeds with Azure AI Foundry). Empty = defaults.
      - PAD_EMBEDDING_DIM=${PAD_EMBEDDING_DIM:-}
      - PAD_EMBEDDING_PROVIDER=${PAD_EMBEDDING_PROVIDER:-}
      # legacy | shadow | declarative (docs/adr/0006); empty = shadow.
      - PAD_ROUTE_POLICY=${PAD_ROUTE_POLICY:-}
      # General per-IP rate budget. The code defaults (1 rps, burst 20) are
      # tuned for public multi-tenant deployments; behind Docker NAT every
      # request — browser and CLI alike — arrives from the single gateway IP,
      # and one app boot fires ~10 API calls, so the default bucket drained
      # on ordinary page loads (429 on /api/dashboard/home etc.). .env raises
      # it for this single-user stack; unset keeps the code default.
      - PAD_RATE_LIMIT_GENERAL_RPS=${PAD_RATE_LIMIT_GENERAL_RPS:-}
      - PAD_RATE_LIMIT_GENERAL_BURST=${PAD_RATE_LIMIT_GENERAL_BURST:-}
      # /metrics is the one endpoint the image-baked PAD_BEHIND_PROXY=true
      # leaves wide open locally: the flag (required so cloud mode accepts the
      # TLS-less database connection below) makes the endpoint's private-IP
      # allowlist pass for every request, so the token is the only gate. .env
      # sets a generated one (see .env.example's PAD_METRICS_TOKEN row); never
      # deploy this stack with a token published in the repository.
      - PAD_METRICS_TOKEN=${PAD_METRICS_TOKEN:?PAD_METRICS_TOKEN must be set}
      # The cache budgets in the code (analyzer report cache, search-index
      # budget, chat scrub memos) are sized as fractions of GOMEMLIMIT=800MiB
      # — the value docker-compose.prod.yml sets. Without it the GC paces at
      # GOGC=100 with no ceiling, and a burst of large flows can balloon the
      # heap toward the VM's own limit. Keep the two values in sync.
      - GOMEMLIMIT=800MiB
    depends_on:
      db:
        condition: service_healthy
    # Least privilege (H1): the distroless image already runs as non-root;
    # drop every Linux capability (the Go binary needs none) and forbid
    # setuid/setgid escalations.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Mirrors docker-compose.prod.yml's app limits: GOMEMLIMIT above is ~80%
    # of the memory cap, so the GC gets headroom to meet it instead of the
    # container being OOM-killed.
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    healthcheck:
      # The distroless image has no shell/wget, so probe via the binary's own
      # healthcheck subcommand (GETs /readyz, exits 0/1).
      test: ["CMD", "./baki-backend", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    # SIGTERM starts the app's stop (drain, chat streams, jobs, HTTP, audit
    # flush, pool close), bounded by its fx.StopTimeout. Docker's default of
    # 10 s SIGKILLed it halfway. Above StopTimeout, like the ACA grace period
    # in infra/main.bicep; the steps are ADR 0024's budget table.
    stop_grace_period: 35s

  db:
    # pgvector, not plain postgres: the `vector` extension backs knowledge-base
    # similarity search. On the stock image the extension does not exist, so
    # migration v20 no-ops and search silently falls back to ranking chunks in
    # Go. Matches the image CI runs against.
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-baki}
      # Password for the unprivileged application role that scripts/db-init
      # creates on first volume init. It used to be a literal inside that
      # script, which meant a production stack built on this file came up with a
      # credential published in this repository. The throwaway default here is
      # scoped to local development — this file serves plaintext HTTP against a
      # TLS-less database and says so at the top. docker-compose.prod.yml makes
      # the variable mandatory with no default.
      - BAKI_APP_PASSWORD=${BAKI_APP_PASSWORD:-baki_app}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs ONLY on an empty data volume (postgres entrypoint behaviour):
      # creates the unprivileged baki_app role, hands it ownership so its
      # migrations can FORCE ROW LEVEL SECURITY, and pre-installs pgvector
      # (untrusted, so it needs the superuser). Read-only mount — nothing in
      # here should ever be writable by the container.
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    # Postgres's compiled-in defaults assume a machine from 2005 (see
    # docker-compose.prod.yml's db service for the full rationale). Sized for
    # the 1G memory limit under deploy.resources below — scale them TOGETHER:
    #   shared_buffers       ~25% of the memory limit
    #   effective_cache_size ~75% of the memory limit
    #   work_mem             per sort/hash per query, so (max_connections x
    #                        work_mem x a few) must fit in what is left
    # pg_stat_statements + log_min_duration_statement are the two
    # observability hooks a perf investigation needs; preloading the library
    # only allocates its shared-memory slot, the extension itself has to be
    # CREATEd in the database — scripts/db-init/02-pg-stat-statements.sql
    # does that on first init of an empty volume; an existing volume runs
    # the same statement once by hand as the superuser.
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_wal_size=1GB
      -c checkpoint_completion_target=0.9
      -c wal_compression=on
      -c jit=off
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_min_duration_statement=500
    # Docker's default /dev/shm is 64MB; parallel workers and hash joins use
    # it for dynamic shared memory and fail with "could not resize shared
    # memory segment" once work_mem is raised. Not counted against `memory`.
    shm_size: 128m
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G # the -c settings in `command` above are sized to this
    # no-new-privileges only: the entrypoint's root bootstrap (chown on the
    # data dir) still needs capabilities, so cap_drop stays off for db.
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
