services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PAD_DATABASE_URL=postgres://postgres:postgres@db:5432/baki?sslmode=disable
      # Dev-only secret (>=32 chars). Override with a long random value in production.
      - PAD_AUTH_SECRET=dev-insecure-secret-override-in-prod-2f8b1c4e9a
      # Same-origin SPA needs no CORS origins; add cross-origin dev hosts here if used.
      - PAD_ALLOWED_ORIGINS=http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=baki
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
