# golangci-lint v2 config. v2 is required to analyze go1.25 modules; v1 (built
# with go1.24) aborts with a "language version too low" error. CI must use
# golangci-lint-action@v7+ to install a v2 binary.
version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck   # v2 folds the old gosimple checks into staticcheck
    - unused
    - misspell
    # Security & correctness
    - gosec        # security heuristics: SQLi, weak crypto, hardcoded secrets
    - errorlint    # correct wrapped-error comparison (errors.Is/As)
    - bodyclose    # ensure HTTP response bodies are closed
    - nolintlint   # keep //nolint directives honest and specific
    # sqlclosecheck + rowserrcheck encode an invariant this codebase already
    # maintains BY HAND across the whole Postgres layer: every *sql.Rows is
    # closed, and rows.Err() is checked after every iteration (audited — there
    # were zero violations when these were enabled, so they cost no remediation
    # and are pure regression insurance). A missed rows.Err() silently truncates
    # a result set instead of failing, which is the shape of the full-table-walk
    # bug phase B9 had to find by hand.
    - sqlclosecheck
    - rowserrcheck
    # contextcheck is intentionally NOT enabled: this codebase deliberately uses
    # ctx-less settings/parser APIs and detached background contexts (logging,
    # websocket lifecycle, cleanup goroutines). Satisfying it means threading ctx
    # through public APIs — a separate refactor, not lint debt.
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        # Idiomatic ignores: cleanup Close/Rollback on rows/stmts/conns, and
        # deadline/Close on websocket conns in read/write pumps.
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.Conn).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (*github.com/gorilla/websocket.Conn).Close
        - (*github.com/gorilla/websocket.Conn).SetReadDeadline
        - (*github.com/gorilla/websocket.Conn).SetWriteDeadline
        - fmt.Fprintf
        - fmt.Fprint
        - fmt.Fprintln
        - io.WriteString # used to feed hash.Hash, which never errors
    gosec:
      # G104 (unhandled errors) is fully redundant with errcheck, which handles
      # the idiomatic ignores precisely via exclude-functions above.
      excludes:
        - G104
    nolintlint:
      require-specific: true
      allow-unused: false
  exclusions:
    paths:
      # frontend/node_modules is NOT skipped by Go tooling. Go ignores vendor/,
      # testdata/ and dot/underscore directories — node_modules is none of
      # those — so `./...` matches
      # pad-analyzer/frontend/node_modules/flatted/golang/pkg/flatted, a
      # third-party Go package that ships inside an npm dependency. Linting
      # (and failing on) code from the npm tree is not something this repo
      # should do; the directory is gitignored and regenerated by `npm ci`.
      - frontend/node_modules
    rules:
      # Test files routinely ignore Write/Encode errors on in-memory servers,
      # embed dummy credentials/fixtures, and build synthetic *http.Response
      # values with nil bodies; linting those adds noise, not safety.
      - path: _test.go
        linters:
          - errcheck
          - gosec
          - bodyclose
      # Dev-only scripts (sample generators, build helpers) are not shipped.
      - path: scripts/
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
