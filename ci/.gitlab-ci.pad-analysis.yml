# GitLab CI template for PAD Flow Analysis.
#
# Usage in your .gitlab-ci.yml:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/<org>/baki/main/ci/.gitlab-ci.pad-analysis.yml'
#
#   pad-analysis:
#     extends: .pad-analysis
#     variables:
#       FLOW_PATH: './flows'
#       FAIL_ON: 'error'
#       # BASELINE: 'baseline.json'   # ratchet: fail only on NEW findings
#       # POLICY: 'policy.json'       # authoritative gate (overrides FAIL_ON)
#
# This template downloads the bakicli release binary (checksum-verified), runs
# analysis with SARIF output, publishes the SARIF report as a GitLab artifact,
# and fails the pipeline on threshold breach.
#
# It used to run `go build ./cmd/bakicli` inside $CI_PROJECT_DIR — the
# CONSUMER's repository, which has no cmd/bakicli — so it failed in
# before_script for every consumer, every time. Pin BAKI_VERSION to a release
# tag for reproducible gates; "latest" follows the newest release.

.pad-analysis:
  image: alpine:3.20
  variables:
    FLOW_PATH: '.'
    FAIL_ON: 'error'
    BASELINE: ''
    POLICY: ''
    SARIF_FILE: 'pad-analysis.sarif'
    BAKI_REPO: 'dusankuburic/baki'
    BAKI_VERSION: 'latest'
  before_script:
    - apk add --no-cache jq curl bash
    - |
      set -euo pipefail
      case "$(uname -m)" in
        x86_64) goarch=amd64 ;;
        aarch64|arm64) goarch=arm64 ;;
        *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
      esac
      asset="bakicli-linux-${goarch}.tar.gz"
      if [ "$BAKI_VERSION" = "latest" ]; then
        base="https://github.com/${BAKI_REPO}/releases/latest/download"
      else
        base="https://github.com/${BAKI_REPO}/releases/download/${BAKI_VERSION}"
      fi
      tmp="$(mktemp -d)"
      curl -fsSL --retry 2 -o "$tmp/$asset" "$base/$asset"
      curl -fsSL --retry 2 -o "$tmp/$asset.sha256" "$base/$asset.sha256"
      ( cd "$tmp" && sha256sum -c "$asset.sha256" )
      tar -xzf "$tmp/$asset" -C "$tmp"
      mv "$tmp/bakicli-linux-${goarch}" /usr/local/bin/bakicli
      chmod +x /usr/local/bin/bakicli
      bakicli -version || true
  script:
    - |
      set -euo pipefail
      args=()
      if [ -n "$POLICY" ]; then
        args+=(-policy "$POLICY")
      else
        gate="$FAIL_ON"
        [ "$gate" = "none" ] && gate="info"
        args+=(-fail-on "$gate")
      fi
      if [ -n "$BASELINE" ]; then
        args+=(-baseline "$BASELINE")
      fi
      # SARIF is emitted before the gate exits non-zero, so the report is complete.
      set +e
      bakicli -format sarif "${args[@]}" "$FLOW_PATH" > "$SARIF_FILE"
      code=$?
      set -e
      echo "Gate exit code: $code"
      # Print a summary to the job log
      bakicli -format json -quiet "$FLOW_PATH" > pad-report.json || true
      if [ -s pad-report.json ]; then
        echo ""
        echo "=== PAD Flow Analysis ==="
        echo "Errors:   $(jq '.stats.errors' pad-report.json)"
        echo "Warnings: $(jq '.stats.warnings' pad-report.json)"
        echo "Info:     $(jq '.stats.info' pad-report.json)"
        echo "Health:   $(jq '.metrics.healthScore // "n/a"' pad-report.json)/100"
        echo "=========================="
      fi
      # Save the exit code for the after_script gate check
      echo "$code" > .gate-exit-code
    # Fail the job if the gate failed.
    #
    # The guard must also fire when a POLICY is set. POLICY is documented as the
    # authoritative gate that overrides FAIL_ON — and the script above does not
    # even pass -fail-on when one is configured — so POLICY=<file> with
    # FAIL_ON=none is the natural way to ask for policy-only gating. Keying
    # enforcement on FAIL_ON alone passed the pipeline on a policy violation.
    - |
      if [ "$FAIL_ON" != "none" ] || [ -n "$POLICY" ]; then
        code=$(cat .gate-exit-code)
        if [ "$code" != "0" ]; then
          if [ -n "$POLICY" ]; then
            echo "PAD analysis gate failed (policy=$POLICY)."
          else
            echo "PAD analysis gate failed (fail-on=$FAIL_ON)."
          fi
          exit "$code"
        fi
      fi
  artifacts:
    when: always
    reports:
      # SARIF reports are surfaced in GitLab merge request widgets as SAST.
      sast: pad-analysis.sarif
    paths:
      - pad-analysis.sarif
      - pad-report.json
    expire_in: 30 days
