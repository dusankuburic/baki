# Azure DevOps Pipeline template for PAD Flow Analysis.
#
# Usage in your azure-pipelines.yml:
#
#   trigger: ['main']
#   pool:
#     vmImage: 'ubuntu-latest'
#   steps:
#     - template: azure-pipelines.pad-analysis.yml@self
#       parameters:
#         flowPath: '$(Build.SourcesDirectory)/flows'
#         failOn: 'error'
#         # baseline: 'baseline.json'  # ratchet: fail only on NEW findings
#         # policy: 'policy.json'      # authoritative gate (overrides failOn)
#
# This template downloads the bakicli release binary (checksum-verified), runs
# analysis with SARIF output, publishes the SARIF report as a build artifact,
# and fails the build if any finding meets the severity threshold.
#
# It used to run `go build ./cmd/bakicli` inside $(Build.SourcesDirectory) —
# the CONSUMER's repository, which has no cmd/bakicli — so it failed for every
# consumer, every time. Pin `version` to a release tag for a reproducible gate.

parameters:
  - name: flowPath
    type: string
    default: '$(Build.SourcesDirectory)'
    displayName: 'Path to PAD flow file or folder'
  - name: failOn
    type: string
    default: 'error'
    values: ['error', 'warning', 'info', 'none']
    displayName: 'Fail the build at this severity or higher'
  - name: baseline
    type: string
    default: ''
    displayName: 'Baseline JSON file (ratchet — fail only on new findings)'
  - name: policy
    type: string
    default: ''
    displayName: 'Policy JSON file (authoritative gate, overrides failOn)'
  - name: sarifFile
    type: string
    default: '$(Build.ArtifactStagingDirectory)/pad-analysis.sarif'
    displayName: 'SARIF output path'
  - name: version
    type: string
    default: 'latest'
    displayName: 'bakicli release tag (e.g. v0.1.0; "latest" = newest release)'
  - name: repo
    type: string
    default: 'dusankuburic/baki'
    displayName: 'GitHub repository that publishes bakicli releases'

steps:
  - script: |
      set -euo pipefail
      case "$(uname -m)" in
        x86_64) goarch=amd64 ;;
        aarch64|arm64) goarch=arm64 ;;
        *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
      esac
      asset="bakicli-linux-${goarch}.tar.gz"
      if [ "${{ parameters.version }}" = "latest" ]; then
        base="https://github.com/${{ parameters.repo }}/releases/latest/download"
      else
        base="https://github.com/${{ parameters.repo }}/releases/download/${{ parameters.version }}"
      fi
      tmp="$(mktemp -d)"
      curl -fsSL --retry 2 -o "$tmp/$asset" "$base/$asset"
      curl -fsSL --retry 2 -o "$tmp/$asset.sha256" "$base/$asset.sha256"
      ( cd "$tmp" && sha256sum -c "$asset.sha256" )
      tar -xzf "$tmp/$asset" -C "$tmp"
      mv "$tmp/bakicli-linux-${goarch}" "$(Agent.TempDirectory)/bakicli"
      chmod +x "$(Agent.TempDirectory)/bakicli"
    displayName: 'Download bakicli release binary'

  - script: |
      set -euo pipefail
      BAKICLI="$(Agent.TempDirectory)/bakicli"
      args=()
      if [ -n "${{ parameters.policy }}" ]; then
        args+=(-policy "${{ parameters.policy }}")
      else
        gate="${{ parameters.failOn }}"
        [ "$gate" = "none" ] && gate="info"
        args+=(-fail-on "$gate")
      fi
      if [ -n "${{ parameters.baseline }}" ]; then
        args+=(-baseline "${{ parameters.baseline }}")
      fi
      # SARIF is emitted before the gate exits non-zero, so the report is complete.
      set +e
      "$BAKICLI" -format sarif "${args[@]}" "${{ parameters.flowPath }}" > "${{ parameters.sarifFile }}"
      code=$?
      set -e
      echo "##vso[task.setvariable variable=gateExitCode]$code"
      # A configured POLICY is authoritative and overrides failOn (the block
      # above does not even pass -fail-on when one is set), so enforcement must
      # not be conditioned on failOn alone — policy=<file> with failOn=none is
      # the documented way to ask for policy-only gating, and it used to pass
      # the build on a violation.
      if [ "$code" != "0" ] && { [ "${{ parameters.failOn }}" != "none" ] || [ -n "${{ parameters.policy }}" ]; }; then
        if [ -n "${{ parameters.policy }}" ]; then
          echo "##vso[task.logissue type=error]PAD analysis gate failed (policy=${{ parameters.policy }})."
        else
          echo "##vso[task.logissue type=error]PAD analysis gate failed (fail-on=${{ parameters.failOn }})."
        fi
      fi
    displayName: 'Analyze flows (SARIF + gate)'

  - script: |
      BAKICLI="$(Agent.TempDirectory)/bakicli"
      "$BAKICLI" -format json -quiet "${{ parameters.flowPath }}" > "$(Agent.TempDirectory)/pad-report.json" || true
      report="$(Agent.TempDirectory)/pad-report.json"
      echo "## PAD Flow Analysis"
      echo ""
      if [ -s "$report" ]; then
        errors=$(jq '.stats.errors' "$report")
        warnings=$(jq '.stats.warnings' "$report")
        info=$(jq '.stats.info' "$report")
        health=$(jq '.metrics.healthScore // "n/a"' "$report")
        echo "Errors: **$errors** · Warnings: **$warnings** · Info: **$info**"
        echo "Health score: **$health/100**"
      else
        echo "_No report produced._"
      fi
    condition: always()
    displayName: 'Analysis summary'

  - task: PublishBuildArtifact@1
    condition: always()
    displayName: 'Publish SARIF report'
    inputs:
      pathToPublish: '${{ parameters.sarifFile }}'
      artifactName: 'pad-analysis-sarif'
      publishLocation: 'Container'

  - script: |
      code="$(gateExitCode)"
      if [ "$code" != "0" ]; then
        exit "$code"
      fi
    # Mirrors the shell guard above: enforce when a severity gate is active OR
    # a policy is configured.
    condition: and(always(), or(ne('${{ parameters.failOn }}', 'none'), ne('${{ parameters.policy }}', '')))
    displayName: 'Enforce gate'
