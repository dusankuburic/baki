<!DOCTYPE html>

<head>
    <meta charset="UTF-8"/>

    <meta name="theme-color" content="#0a0a0b"/>
    <meta name="description" content="Static analysis, auto-fix, and AI-assisted review for Power Automate Desktop flows."/>
    <meta property="og:title" content="PAD Analyzer"/>
    <meta property="og:description" content="Static analysis, auto-fix, and AI-assisted review for Power Automate Desktop flows."/>
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="PAD Analyzer"/>
    <meta name="twitter:card" content="summary"/>

    <meta name="twitter:description" content="Static analysis, auto-fix, and AI-assisted review for Power Automate Desktop flows."/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="PAD Analyzer"/>
    <title>PAD Analyzer</title>
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-256.png">
    <script>
        (function () {
            // Sync the browser/PWA chrome color with the active theme's surface-0.
            // Best-effort: the stylesheet may not be parsed on the first call, so
            // also retry after the first frame. useTheme keeps it in sync after mount.
            function syncThemeColor() {
                try {
                    var surface = getComputedStyle(document.documentElement)
                        .getPropertyValue('--surface-0').trim();
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta && surface) meta.setAttribute('content', surface);
                } catch (e) { /* ignore */ }
            }
            try {
                var cached = window.__INITIAL_THEME__ || localStorage.getItem('pad-theme');
                if (cached && cached !== 'system') {
                    document.documentElement.dataset.theme = cached;
                } else {
                    document.documentElement.dataset.theme =
                        window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                }
            } catch (e) {
                document.documentElement.dataset.theme = 'dark';
            }
            syncThemeColor();
            if (typeof requestAnimationFrame === 'function') requestAnimationFrame(syncThemeColor);
        })();
    </script>
</head>
<body>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
