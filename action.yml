name: 'PAD Flow Analysis'
description: 'Static analysis for Power Automate Desktop flows. Emits SARIF for GitHub code scanning and gates the build on a severity threshold or policy.'
author: 'baki'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  flow-path:
    description: 'Path to a PAD flow file or folder to analyze.'
    required: false
    default: '.'
  fail-on:
    description: 'Minimum severity that fails the build: error, warning, info, or none (report-only).'
    required: false
    default: 'error'
  rules:
    description: 'Comma-separated rule IDs to enable (empty = all enabled rules).'
    required: false
    default: ''
  format:
    description: 'Output format for the report: sarif, json, junit, csv, html, text.'
    required: false
    default: 'sarif'
  policy:
    description: 'Optional path to a policy JSON file. When set it is the authoritative gate (overrides fail-on).'
    required: false
    default: ''
  baseline:
    description: 'Optional path to a baseline JSON file (committed alongside the flow). When set the gate fails only on NEW findings since the baseline (the ratchet) — adopt the gate without fixing everything first. Capture/refresh a clean state with `bakicli -update-baseline <path>`.'
    required: false
    default: ''
  sarif-file:
    description: 'Path to write the SARIF report.'
    required: false
    default: 'pad-analysis.sarif'
  upload-sarif:
    description: 'Upload the SARIF report to GitHub code scanning (requires security-events: write).'
    required: false
    default: 'true'
  comment-on-pr:
    description: 'Post a summary comment on the pull request (requires pull-requests: write, only fires on pull_request events).'
    required: false
    default: 'true'
  version:
    description: 'bakicli release tag to download (e.g. v1.2.0; "latest" resolves the newest release). Falls back to building from the action checkout when the download is unavailable (air-gapped runners, pre-release tags).'
    required: false
    default: 'latest'

outputs:
  sarif-file:
    description: 'Path to the generated SARIF report.'
    value: ${{ inputs.sarif-file }}
  exit-code:
    description: 'The analyzer gate exit code (0 = passed, 1 = threshold/policy violated).'
    value: ${{ steps.analyze.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    # Acquire bakicli from GitHub Releases (fast, pin-able via the `version`
    # input, checksum-verified via the .sha256 sidecar shipped per RELEASE.md).
    # Every run used to compile the CLI from source through setup-go — slow
    # first-runs and no pinning story. Any download failure (air-gapped
    # runner, tag predating the release assets) falls back to a source build.
    - name: Acquire bakicli (release binary)
      id: acquire
      shell: bash
      env:
        BAKI_REPO: ${{ github.action_repository }}
        BAKI_VERSION: ${{ inputs.version }}
      run: |
        set -uo pipefail
        case "${{ runner.os }}" in
          Linux) goos=linux ;;
          macOS) goos=darwin ;;
          Windows) goos=windows ;;
          *) echo "unsupported OS: ${{ runner.os }}"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
        esac
        case "${{ runner.arch }}" in
          X64) goarch=amd64 ;;
          ARM64) goarch=arm64 ;;
          *) echo "unsupported arch: ${{ runner.arch }}"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
        esac
        ext="tar.gz"; [ "$goos" = "windows" ] && ext="zip"
        if [ "$BAKI_VERSION" = "latest" ]; then
          base="https://github.com/${BAKI_REPO}/releases/latest/download"
        else
          base="https://github.com/${BAKI_REPO}/releases/download/${BAKI_VERSION}"
        fi
        asset="bakicli-${goos}-${goarch}.${ext}"
        tmp="$(mktemp -d)"
        if ! curl -fsSL --retry 2 -o "$tmp/$asset" "$base/$asset"; then
          echo "download failed for $base/$asset — falling back to source build"
          echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        if ! curl -fsSL --retry 2 -o "$tmp/$asset.sha256" "$base/$asset.sha256"; then
          echo "checksum sidecar missing — falling back to source build"
          echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        # Verify integrity (sha256sum ships in the runner's bash).
        ( cd "$tmp" && sha256sum -c "$asset.sha256" ) || { echo "checksum mismatch — falling back to source build"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; }
        bin="${{ runner.temp }}/bakicli"
        mkdir -p "${{ runner.temp }}"
        if [ "$ext" = "zip" ]; then
          # -j flattens: the archive holds bakicli.exe at its root.
          unzip -o -j "$tmp/$asset" -d "${{ runner.temp }}" >/dev/null
        else
          tar -xzf "$tmp/$asset" -C "$tmp"
          mv "$tmp/bakicli-${goos}-${goarch}" "$bin"
        fi
        chmod +x "$bin" 2>/dev/null || true
        echo "acquired release binary $asset"

    - name: Set up Go (fallback toolchain)
      if: ${{ steps.acquire.outputs.build == 'true' }}
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - name: Build bakicli (fallback)
      if: ${{ steps.acquire.outputs.build == 'true' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        VERSION=$(git describe --tags --always 2>/dev/null || echo "ci")
        go build -ldflags "-X main.version=${VERSION}" -o "${{ runner.temp }}/bakicli" ./cmd/bakicli

    - name: Analyze flows (SARIF + gate)
      id: analyze
      shell: bash
      run: |
        set -euo pipefail
        args=()
        if [ -n "${{ inputs.policy }}" ]; then
          args+=(-policy "${{ inputs.policy }}")
        else
          gate="${{ inputs.fail-on }}"
          [ "$gate" = "none" ] && gate="info"
          args+=(-fail-on "$gate")
        fi
        if [ -n "${{ inputs.rules }}" ]; then
          args+=(-rules "${{ inputs.rules }}")
        fi
        if [ -n "${{ inputs.baseline }}" ]; then
          args+=(-baseline "${{ inputs.baseline }}")
        fi
        out_format="${{ inputs.format }}"
        [ -z "$out_format" ] && out_format="sarif"
        out_file="${{ inputs.sarif-file }}"
        # SARIF is emitted before the gate exits non-zero, so the report is complete.
        BAKICLI="${{ runner.temp }}/bakicli"
        [ -x "$BAKICLI" ] || BAKICLI="${{ runner.temp }}/bakicli.exe"
        set +e
        "$BAKICLI" -format "$out_format" "${args[@]}" "${{ inputs.flow-path }}" > "$out_file"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Job summary
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        report="${{ runner.temp }}/pad-report.json"
        "${{ runner.temp }}/bakicli" -format json -quiet "${{ inputs.flow-path }}" > "$report" || true
        {
          echo "## PAD Flow Analysis"
          echo ""
          if [ -s "$report" ]; then
            echo "| Severity | Count |"
            echo "|---|---:|"
            echo "| 🔴 Errors | $(jq '.stats.errors' "$report") |"
            echo "| 🟠 Warnings | $(jq '.stats.warnings' "$report") |"
            echo "| 🔵 Info | $(jq '.stats.info' "$report") |"
            echo "| 🤫 Suppressed (inline) | $(jq '.stats.suppressed' "$report") |"
            echo ""
            echo "Health score: **$(jq '.metrics.healthScore // "n/a"' "$report")/100** · blocks analyzed: $(jq '.stats.blocksAnalyzed' "$report")"
          else
            echo "_No report produced._"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Warn on upload-sarif without sarif format
      if: ${{ always() && inputs.upload-sarif == 'true' && inputs.format != 'sarif' }}
      shell: bash
      run: |
        echo "::warning::upload-sarif=true requires format=sarif (currently format=${{ inputs.format }}); skipping SARIF upload."

    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && inputs.format == 'sarif' }}
      uses: github/codeql-action/upload-sarif@b7351df727350dca84cb9d725d57dcf5bc82ba26  # v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: pad-analysis

    # The condition must also fire when a POLICY is configured. `policy` is
    # documented as "the authoritative gate (overrides fail-on)", so the natural
    # way to ask for policy-only enforcement is policy=<file> with
    # fail-on=none — and that combination used to skip this step entirely,
    # passing the build on a policy violation. The analyze step already drops
    # -fail-on whenever a policy is set, so fail-on carries no meaning there;
    # gating enforcement on it alone was the bug.
    - name: Enforce gate
      if: ${{ inputs.fail-on != 'none' || inputs.policy != '' }}
      shell: bash
      run: |
        code="${{ steps.analyze.outputs.exit-code }}"
        if [ "$code" != "0" ]; then
          if [ -n "${{ inputs.policy }}" ]; then
            echo "::error::PAD analysis gate failed (policy=${{ inputs.policy }})."
          else
            echo "::error::PAD analysis gate failed (fail-on=${{ inputs.fail-on }})."
          fi
          exit "$code"
        fi

    - name: Comment on pull request
      if: ${{ always() && github.event_name == 'pull_request' && inputs.comment-on-pr == 'true' }}
      uses: actions/github-script@d7906e4ad0b1822423a8e9a043a9c665e3ae5c4a  # v7
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const reportPath = `${{ runner.temp }}/pad-report.json`;
          let body = '## PAD Flow Analysis\n\n';
          try {
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const s = report.stats || {};
            const m = report.metrics || {};
            const icon = s.errors > 0 ? '🔴' : s.warnings > 0 ? '🟠' : '✅';
            body += `${icon} **${s.errors}** error(s) · **${s.warnings}** warning(s) · **${s.info}** info\n`;
            body += `Health: **${m.healthScore ?? 'n/a'}/100** · Blocks: ${s.blocksAnalyzed}\n`;
            if (s.suppressed > 0) body += ` (${s.suppressed} suppressed inline)`;
          } catch {
            body += '_No report produced._';
          }
          // Use update-or-create so re-pushes update the existing comment instead of stacking.
          const {data: comments} = await github.rest.issues.listComments({
            ...context.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('## PAD Flow Analysis'));
          if (existing) {
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });
          }
