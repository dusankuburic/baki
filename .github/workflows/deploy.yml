name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  # GHCR stays as the registry for self-hosters: docker-compose.prod.yml pulls
  # `latest` from here. Azure does NOT pull from GHCR any more — see ACR below.
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Repository name inside the Azure Container Registry.
  ACR_IMAGE_NAME: baki-backend

jobs:
  # Gate the entire deploy pipeline on CI passing. Without this, a push to
  # main could deploy with broken tests — deploy.yml and ci.yml trigger on the
  # same event but were independent pipelines. The reusable-workflow call
  # executes all CI jobs (go-test, frontend, e2e, lint, vulncheck, bicep) and
  # fails here if any of them fail, blocking the deploy.
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push
    needs: ci
    runs-on: ubuntu-latest
    # Deliberately NOT bound to a GitHub Environment. The image is built once
    # and promoted — staging and production deploy the same digest — so the
    # registry and the Azure identity used here are infrastructure-level, not
    # per-environment. Binding this job to an environment would also make a
    # protection rule gate the build as well as the deploy, asking for two
    # approvals per release.
    #
    # Consequence: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and
    # AZURE_CONTAINER_REGISTRY must be REPOSITORY-level secrets. The
    # application secrets (PAD_*) stay environment-scoped on the deploy job.
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      acr-login-server: ${{ steps.acr.outputs.login-server }}
    steps:
      # fetch-depth: 0 so `git describe` can see tags — the build stamp below
      # needs them to produce a human-meaningful version.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      # Without these, every pushed image inherited the Dockerfile's ARG
      # defaults and /api/system/info answered version=0.1.0, gitCommit="",
      # buildDate="" forever — so the endpoint operators use to identify a
      # running deployment could not distinguish any two builds.
      - name: Compute build stamp
        id: stamp
        run: |
          set -euo pipefail
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          # Commit date rather than wall-clock: the same commit rebuilds to the
          # same image.
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Azure Container Registry. The deploy service principal needs AcrPush.
      # The Container App itself pulls with its user-assigned managed identity
      # (AcrPull, granted in infra/main.bicep), so nothing downstream of this
      # job holds a registry credential — which is the reason for moving off
      # GHCR for the Azure path: managed identity cannot authenticate to GHCR,
      # so ACA needed a long-lived classic PAT present at every restart and
      # scale event.
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        id: acr
        run: |
          set -euo pipefail
          REGISTRY_NAME="${{ secrets.AZURE_CONTAINER_REGISTRY }}"
          if [ -z "$REGISTRY_NAME" ]; then
            echo "::error::AZURE_CONTAINER_REGISTRY is not set. Provision the registry with infra/registry.bicep and add its NAME (not login server) as a secret."
            exit 1
          fi
          az acr login --name "$REGISTRY_NAME"
          echo "login-server=${REGISTRY_NAME,,}.azurecr.io" >> "$GITHUB_OUTPUT"

      # No `latest` here. The image is pushed BEFORE Trivy scans it (the scan
      # job needs a pushed digest to pull), so a `latest` tag at this point
      # would hand docker-compose.prod.yml — which pulls `latest` — an unscanned
      # image. The promote-latest job below re-tags the same digest as `latest`
      # only after scan + SBOM pass.
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        id: meta
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ steps.acr.outputs.login-server }}/${{ env.ACR_IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # One build, pushed to both registries. The manifest is content-addressed,
      # so `digest` below is the same in ACR and GHCR — the Azure deploy pins
      # that digest, and a floating tag can't sneak in.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.stamp.outputs.version }}
            GIT_COMMIT=${{ steps.stamp.outputs.commit }}
            BUILD_DATE=${{ steps.stamp.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: Vulnerability scan
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # GHCR images are private; authenticate so Trivy can pull by digest.
      # Scanning the GHCR copy is equivalent — same digest, same bytes.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Gate releases on image vulnerability scanning.
      # Fails the job (and therefore deploy) on any HIGH/CRITICAL finding that
      # has a published fix; unfixed issues are reported but non-blocking.
      - uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # 0.24.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  sbom:
    # Generate a Software Bill of Materials for supply-
    # chain attestation. Produces a CycloneDX SBOM from the pushed image and
    # uploads it as a workflow artifact (retrievable per-run for audit). This is
    # additive to the Trivy scan above — Trivy gates on known CVEs, the SBOM is
    # the inventory of every package/dependency in the image.
    name: Generate SBOM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0  # v0.18.0
        with:
          image: ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
          format: cyclonedx-json
          artifact-name: sbom.cdx.json

  promote-latest:
    # Publish gate: `latest` is what docker-compose.prod.yml pulls onto the
    # group's own boxes, so it must only ever point at a digest that passed
    # the vulnerability scan. Re-tagging by digest (imagetools) adds no new
    # layers — it is exactly the scanned image.
    name: Promote scanned image to latest
    needs: [build-and-push, scan, sbom]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Tag scanned digest as latest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "ghcr.io/${{ env.IMAGE_NAME }}:latest" \
            "ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}"

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    needs: [ci, build-and-push, scan, sbom]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      # Full history: the rollback guard below diffs the migration sources between the serving image's commit
      # and this one.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The image currently serving traffic, captured before we replace it, so
      # a failed smoke test has something to roll back to. Empty on the first
      # deploy, which the rollback step handles.
      - name: Capture current revision image
        id: current
        run: |
          set -euo pipefail
          IMAGE=$(az containerapp show \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Previously deployed image: ${IMAGE:-<none, first deploy>}"

      # An old binary refuses to start against a newer schema (postgres_migrations.go), so once this release's
      # migrations have run, putting the previous image back would only crash-loop it. Decide BEFORE deploying
      # whether this release changes the migration sources relative to the serving image: "false" allows the
      # automatic rollback below; "true" or "unknown" (first deploy, untagged image, failed lookup) blocks it in
      # favour of a manual decision. The images carry their short commit SHA as a tag (docker/metadata-action).
      - name: Check whether this release changes schema migrations
        id: schema
        run: |
          set -uo pipefail
          PREV_IMAGE="${{ steps.current.outputs.image }}"
          CHANGED=unknown
          REASON="no serving image (first deploy)"
          if [ -n "$PREV_IMAGE" ]; then
            if [[ "$PREV_IMAGE" == *@sha256:* ]]; then
              DIGEST="${PREV_IMAGE##*@}"
              TAGS=$(az acr manifest list-metadata \
                --registry "${{ secrets.AZURE_CONTAINER_REGISTRY }}" \
                --name "${{ env.ACR_IMAGE_NAME }}" \
                --query "[?digest=='${DIGEST}'].tags[]" -o tsv 2>/dev/null || true)
            else
              TAGS="${PREV_IMAGE##*:}"
            fi
            PREV_SHA=$(printf '%s\n' "$TAGS" | tr -s '\t ' '\n' | grep -E '^[0-9a-f]{7,40}$' | head -n 1 || true)
            if [ -z "$PREV_SHA" ]; then
              REASON="no commit tag found for ${PREV_IMAGE}"
            elif ! git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
              REASON="commit ${PREV_SHA} is not in this repository's history"
            else
              git diff --quiet "$PREV_SHA" HEAD -- \
                internal/storage/database/postgres_migrations.go internal/storage/database/migrations
              case $? in
                0) CHANGED=false; REASON="no migration changes since ${PREV_SHA}" ;;
                1) CHANGED=true; REASON="migration sources changed since ${PREV_SHA}" ;;
                *) REASON="git diff against ${PREV_SHA} failed" ;;
              esac
            fi
          fi
          echo "migrations_changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "Schema migrations changed since the serving image: ${CHANGED} (${REASON})"

      # Template correctness is gated in CI by the `bicep` job, which compiles
      # every infra/*.bicep and treats warnings as failures. A `what-if` here
      # would need the full parameter set duplicated to produce a diff that is
      # not misleading; run it by hand against a scratch resource group when
      # reviewing an infrastructure change (see README).

      # Deploy the IaC so the environment is reproducible from the repo rather
      # than from portal drift. The image is pinned by digest from the build
      # job. Parameter VALUES ARE QUOTED: the previous unquoted `>`-folded form
      # split any secret containing a space into two arguments.
      #
      # maxReplicas stays 1 deliberately — internal/api/events.go is an
      # in-process SSE hub, so a second replica silently breaks chat streaming.
      # See the header of infra/main.bicep.
      - name: Deploy infrastructure
        id: deploy
        uses: azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5  # v2
        with:
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          # Azure Foundry / knowledge-base operator knobs below come from
          # repository variables, not secrets (none is sensitive). The bool
          # comparison renders a bare true/false so an unset variable keeps
          # the template default.
          parameters: >-
            appName="${{ secrets.AZURE_CONTAINER_APP_NAME }}"
            registryName="${{ secrets.AZURE_CONTAINER_REGISTRY }}"
            image="${{ needs.build-and-push.outputs.acr-login-server }}/${{ env.ACR_IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}"
            authSecret="${{ secrets.PAD_AUTH_SECRET }}"
            encryptionKey="${{ secrets.PAD_ENCRYPTION_KEY }}"
            databaseUrl="${{ secrets.PAD_DATABASE_URL }}"
            metricsToken="${{ secrets.PAD_METRICS_TOKEN }}"
            ciWebhookSecret="${{ secrets.PAD_CI_WEBHOOK_SECRET }}"
            smtpHost="${{ secrets.PAD_SMTP_HOST }}"
            smtpUsername="${{ secrets.PAD_SMTP_USERNAME }}"
            smtpPassword="${{ secrets.PAD_SMTP_PASSWORD }}"
            emailFrom="${{ secrets.PAD_EMAIL_FROM }}"
            appBaseUrl="${{ secrets.PAD_APP_BASE_URL }}"
            ssoIssuer="${{ secrets.PAD_SSO_ISSUER }}"
            ssoClientId="${{ secrets.PAD_SSO_CLIENT_ID }}"
            ssoClientSecret="${{ secrets.PAD_SSO_CLIENT_SECRET }}"
            ssoRedirectUrl="${{ secrets.PAD_SSO_REDIRECT_URL }}"
            storageAccountResourceId="${{ secrets.AZURE_STORAGE_ACCOUNT_ID }}"
            allowedOrigins="${{ secrets.PAD_ALLOWED_ORIGINS }}"
            azureFoundryAllowedHosts="${{ vars.PAD_AZURE_FOUNDRY_ALLOWED_HOSTS }}"
            aiAllowPrivateEgress=${{ vars.PAD_AI_ALLOW_PRIVATE_EGRESS == 'true' }}
            embeddingProvider="${{ vars.PAD_EMBEDDING_PROVIDER }}"
            embeddingDim="${{ vars.PAD_EMBEDDING_DIM }}"
            alertEmails="${{ secrets.ALERT_EMAILS }}"
            minReplicas=1
            maxReplicas=1

      # Probe /readyz (not /healthz): /healthz is an unconditional 200 liveness
      # marker, so it would pass even with the database or blob unreachable.
      # /readyz gates on backend + blob + Redis reachability, so a deploy with a
      # broken connection fails this gate instead of silently accepting traffic.
      #
      # The hostname comes from the template's own `fqdn` output. It used to be
      # a hand-maintained secret, which meant an unset value made this curl
      # `https:///readyz` and fail after 50 seconds for the wrong reason.
      - name: Smoke test
        id: smoke
        shell: bash
        run: |
          set -uo pipefail
          FQDN="${{ steps.deploy.outputs.fqdn }}"
          if [ -z "$FQDN" ]; then
            echo "::error::Deployment produced no fqdn output."
            exit 1
          fi
          echo "Probing https://${FQDN}/readyz"
          # A cold start runs schema migrations before it can answer. Wait at
          # least as long as the template's startup-probe window (~5 minutes by
          # default), or a slow but healthy migration reads as a failed deploy.
          for i in $(seq 1 66); do
            if curl -sf --max-time 10 "https://${FQDN}/readyz" > /dev/null 2>&1; then
              echo "Readiness check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, waiting 5s..."
            sleep 5
          done
          echo "::error::Readiness check failed after 66 attempts (5.5+ minutes)"
          exit 1

      # The template runs in Single revision mode, so the new revision is
      # already live by the time the smoke test runs. If it failed, put the
      # previous image back rather than leaving a broken revision serving --
      # but only when this release changed no migrations (see the schema step).
      - name: Roll back on smoke-test failure
        if: failure() && steps.smoke.outcome == 'failure' && steps.current.outputs.image != '' && steps.schema.outputs.migrations_changed == 'false'
        run: |
          set -euo pipefail
          echo "::warning::Smoke test failed — rolling back to ${{ steps.current.outputs.image }}"
          az containerapp update \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.current.outputs.image }}"
          echo "Rollback issued. The deploy job still fails so the bad build is not treated as shipped."

      # With migrations changed (or unknown) the previous image would refuse the newer schema and crash-loop, so an
      # automatic rollback would trade a failed revision for an outage. Fail with the manual options instead.
      - name: Block rollback when the schema may have advanced
        if: failure() && steps.smoke.outcome == 'failure' && steps.current.outputs.image != '' && steps.schema.outputs.migrations_changed != 'false'
        run: |
          echo "::error::Smoke test failed, but NOT rolling back automatically: this release's schema migrations may already have run (migrations_changed=${{ steps.schema.outputs.migrations_changed || 'unknown' }}), and the previous image refuses a newer schema, so it would crash-loop."
          echo "::error::Fix forward with a new deploy, or roll the schema back first (bakicli migrate down <latest version the previous image knows>) and then redeploy ${{ steps.current.outputs.image }}."

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Deploy to ${{ github.event.inputs.environment || 'staging' }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| App URL | ${{ steps.deploy.outputs.appUrl || 'n/a' }} |"
            echo "| Image digest | \`${{ needs.build-and-push.outputs.image-digest }}\` |"
            echo "| Previous image | \`${{ steps.current.outputs.image || 'none (first deploy)' }}\` |"
            echo "| Migrations changed | ${{ steps.schema.outputs.migrations_changed || 'n/a' }} |"
            echo "| Smoke test | ${{ steps.smoke.outcome || 'skipped' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
