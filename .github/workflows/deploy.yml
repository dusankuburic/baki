name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Gate the entire deploy pipeline on CI passing. Without this, a push to
  # main could deploy with broken tests — deploy.yml and ci.yml trigger on the
  # same event but were independent pipelines. The reusable-workflow call
  # executes all CI jobs (go-test, frontend, e2e, lint, vulncheck) and fails
  # here if any of them fail, blocking the deploy.
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: Vulnerability scan
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # GHCR images are private; authenticate so Trivy can pull by digest.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # S4 (IMPROVEMENTS.md): gate releases on image vulnerability scanning.
      # Fails the job (and therefore deploy) on any HIGH/CRITICAL finding that
      # has a published fix; unfixed issues are reported but non-blocking.
      - uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # 0.24.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  sbom:
    # I4 (IMPROVEMENTS.md): generate a Software Bill of Materials for supply-
    # chain attestation. Produces a CycloneDX SBOM from the pushed image and
    # uploads it as a workflow artifact (retrievable per-run for audit). This is
    # additive to the Trivy scan above — Trivy gates on known CVEs, the SBOM is
    # the inventory of every package/dependency in the image.
    name: Generate SBOM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0  # v0.18.0
        with:
          image: ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
          format: cyclonedx-json
          artifact-name: sbom.cdx.json

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    needs: [ci, build-and-push, scan, sbom]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deploy the hardened IaC (infra/main.bicep) so the container
      # securityContext (#19: non-root, cap-drop-ALL, read-only root fs) and
      # reproducible environment (#13) are applied at deploy time. The image is
      # pinned by digest from the build job — a floating tag can't sneak in.
      # The resource group must pre-exist (the Bicep is resource-group scoped).
      - uses: azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5  # v2
        with:
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >
            appName=${{ secrets.AZURE_CONTAINER_APP_NAME }}
            image=ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
            authSecret=${{ secrets.PAD_AUTH_SECRET }}
            databaseUrl=${{ secrets.PAD_DATABASE_URL }}
            keyVaultUrl=${{ secrets.PAD_KEYVAULT_URL }}
            storageAccountResourceId=${{ secrets.AZURE_STORAGE_ACCOUNT_ID }}

      - name: Smoke test
        shell: bash
        run: |
          # Probe /readyz (not /healthz): /healthz is an unconditional 200
          # liveness marker, so it would pass even with the DB or blob
          # unreachable. /readyz gates on backend + Redis reachability, so a
          # deploy with a broken DB/blob connection fails this gate instead of
          # silently accepting traffic.
          for i in $(seq 1 10); do
            if curl -sf "https://${{ secrets.AZURE_CONTAINER_APP_FQDN }}/readyz" > /dev/null 2>&1; then
              echo "Readiness check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, waiting 5s..."
            sleep 5
          done
          echo "Readiness check failed after 10 attempts"
          exit 1
