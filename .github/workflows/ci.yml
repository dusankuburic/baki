name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_call:  # allows deploy.yml to gate deploys on CI passing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    # Postgres backs the storage contract / RLS / DB+blob E2E tests (they skip
    # when DATABASE_URL is unset). A service container is fine here — unlike
    # Azurite it needs no command override.
    #
    # pgvector/pgvector:pg16, not postgres:16-alpine: the stock image ships no
    # `vector` extension, so the server-side knowledge-search pushdown could
    # never initialize and its integration test skipped on every CI run. That
    # blind spot hid a real result divergence between the pgvector and Go
    # ranking paths. Same Postgres 16, plus the extension.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baki
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
          cache: true
      # Azurite backs the blob-storage integration tests in
      # internal/storage/database (they skip when AZURITE_CONNECTION_STRING is
      # unset). Run it via `docker run` rather than a service container so we can
      # pass --skipApiVersionCheck: the azblob SDK sends a newer x-ms-version
      # than published Azurite images accept, and GitHub service containers
      # cannot override the command/args.
      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/10000) 2>/dev/null && { echo "azurite ready"; break; }
            sleep 1
          done
      # The Postgres suite must NOT connect as a superuser. Superusers and
      # BYPASSRLS roles ignore Row-Level Security entirely, so every negative
      # RLS assertion (`skipIfRLSBypassed`) silently SKIPPED — the isolation
      # guarantees the policies exist to provide had never once been checked in
      # CI. Owning the database also reproduces production's table ownership,
      # which is what makes the difference between ENABLE and FORCE ROW LEVEL
      # SECURITY observable at all: without FORCE, policies do not apply to the
      # owner, and the app runs as the owner because it runs its own
      # migrations. Ten tables were in that state and CI could not see it.
      #
      # NOSUPERUSER NOBYPASSRLS is the whole point — do not "simplify" this
      # back to the postgres superuser.
      #
      # CREATEDB does not bypass RLS. It lets internal/testutil/pgtest give the
      # tests that rewrite schema state (migrate down, tampered checksums,
      # future-version rows) a database of their own, cloned from
      # baki_template; on the shared database those writes raced every other
      # test binary booting against it.
      - name: Create unprivileged app role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE baki_app LOGIN PASSWORD 'baki_app' NOSUPERUSER NOBYPASSRLS CREATEDB;" \
            -c "CREATE DATABASE baki_app OWNER baki_app;" \
            -c "CREATE DATABASE baki_template OWNER baki_app;"
          # `vector` is not a trusted extension, so the unprivileged role cannot
          # install it — exactly as in production, where a DBA does this once.
          # Without it the app's best-effort CREATE EXTENSION no-ops and the
          # pgvector path stays dark. baki_template carries it into every
          # database pgtest clones from it.
          for db in baki_app baki_template; do
            psql -h localhost -U postgres -d "$db" -v ON_ERROR_STOP=1 \
              -c "CREATE EXTENSION IF NOT EXISTS vector;"
          done
      - name: Vet
        run: go vet ./... ./core/...
      - name: Test
        env:
          AZURITE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
          DATABASE_URL: "postgres://baki_app:baki_app@localhost:5432/baki_app?sslmode=disable"
        run: go test -race -count=1 -coverprofile=coverage.out ./... ./core/...
      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build server
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o baki-backend .
      - name: Build CLI
        run: go build -o bakicli ./cmd/bakicli

  previous-release-boot:
    # The rollback promise of docs/adr/0002: a binary boots on a newer schema exactly when every newer step is
    # marked `-- baki:compat expand`, so rolling the image back after an expand-only release needs no schema
    # rollback. This proves it with real binaries rather than trusting the markers.
    # scripts/ci/previous-release-boot.sh (it runs locally too, see docs/architecture/safety-nets.md) boots the
    # previous release on an empty database, this revision on top of it (the deploy), then the previous release
    # again (the rollback), which must answer /readyz. A newer step marked breaking fails the job, and so does one
    # marked expand that the previous release cannot boot on.
    #
    # The previous release is the pull request's base commit, or for a push the commit the branch pointed at
    # before it: deploy.yml ships every master push, so that is normally the image its rollback restores. The
    # image actually serving is known only to Azure (deploy.yml's rollback guard asks it, with credentials CI does
    # not have), and no git tag marks releases. With no previous commit (a new branch or tag, a manual run), one that
    # cannot be fetched (force-pushed away) or one that does not build (so it was never deployed), there is
    # nothing to check, and the job says so.
    name: Previous Release Boots on New Schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Resolve the previous release
        id: previous
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) sha="$BASE_SHA" ;;
            push) sha="$BEFORE_SHA" ;;
            *) sha="" ;;
          esac
          # A push that creates a branch or a tag reports an all-zero "before".
          if [ -z "${sha//0/}" ]; then
            echo "::notice::No previous release for this ${EVENT_NAME} event (a new branch or tag, or a manual run): nothing to check."
            sha=""
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        if: steps.previous.outputs.sha != ''
        with:
          path: new
          persist-credentials: false
      # continue-on-error: a force push's "before" may be gone from the remote. The next step says so.
      - name: Check out the previous release
        id: checkout-previous
        if: steps.previous.outputs.sha != ''
        continue-on-error: true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ steps.previous.outputs.sha }}
          path: previous
          persist-credentials: false
      - name: Report an unreachable previous release
        if: steps.previous.outputs.sha != '' && steps.checkout-previous.outcome != 'success'
        env:
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          echo "::warning::Could not fetch the previous release ${PREVIOUS_SHA} (force-pushed away?): nothing to check."
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        if: steps.checkout-previous.outcome == 'success'
        with:
          go-version-file: new/go.mod
          cache: true
          cache-dependency-path: |
            new/go.sum
            previous/go.sum
      # Built like the go-build job's server: static (CGO off), trimmed and stripped. `.` rather than main.go, so a
      # revision whose main package spans several files still builds.
      - name: Build both backends
        id: build
        if: steps.checkout-previous.outcome == 'success'
        env:
          CGO_ENABLED: "0"
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p bin
          (cd new && go build -trimpath -ldflags="-s -w" -o ../bin/new .)
          if (cd previous && go build -trimpath -ldflags="-s -w" -o ../bin/previous .); then
            echo "previous=built" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The previous release ${PREVIOUS_SHA} does not build, so it was never deployed: nothing to check."
          fi
      # The same unprivileged role as go-test (NOSUPERUSER NOBYPASSRLS, owning its database, with the vector
      # extension a superuser installs), so the binaries boot as production's do. No CREATEDB: nothing clones here.
      - name: Create the app role and an empty database
        if: steps.build.outputs.previous == 'built'
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE baki_app LOGIN PASSWORD 'baki_app' NOSUPERUSER NOBYPASSRLS;" \
            -c "CREATE DATABASE baki_boot OWNER baki_app;"
          psql -h localhost -U postgres -d baki_boot -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
      # `bash` explicitly: a script committed from a Windows checkout may lack the executable bit.
      - name: Boot the previous release on this revision's schema
        if: steps.build.outputs.previous == 'built'
        env:
          BOOT_DATABASE_URL: "postgres://baki_app:baki_app@localhost:5432/baki_boot?sslmode=disable"
          BOOT_LOG_DIR: ${{ runner.temp }}/previous-release-boot
        run: bash new/scripts/ci/previous-release-boot.sh bin/previous bin/new
      - name: Upload the boot logs
        if: failure() && steps.build.outputs.previous == 'built'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: previous-release-boot-logs
          path: ${{ runner.temp }}/previous-release-boot/
          retention-days: 7

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
          cache: true
      # v7+ installs golangci-lint v2, which is required to analyze go1.25
      # modules (v1 is built with go1.24 and aborts). The whole tree is clean,
      # so the linter gates all code (no only-new-issues escape hatch).
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa  # v7
        with:
          version: latest
          args: --timeout=5m
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa  # v7
        with:
          version: latest
          working-directory: core
          args: --timeout=5m

  openapi:
    name: OpenAPI Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
          cache: true
      # Regenerate docs/ from the swag annotations in source and fail if the
      # committed files drift — keeps swagger.json an artifact, never a
      # hand-edited file. Version pinned to go.mod's swaggo/swag.
      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6
      - name: Regenerate
        run: swag init -g main.go -o docs --parseDependencyLevel 1
      - name: Check for drift
        run: |
          if ! git diff --exit-code docs/; then
            echo "::error::docs/ is stale — run 'swag init -g main.go -o docs --parseDependencyLevel 1' and commit the result"
            git diff --stat docs/
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # --max-warnings 0, NOT --quiet. Every rule that fires in this config is a
      # warning, and --quiet reports errors only — so the previous invocation
      # could not fail no matter how many problems accumulated (63 at the time
      # this was changed). Suppressions must be explicit and justified in code.
      - run: npx eslint src/ --max-warnings 0
      - run: npx prettier --check src
      # --coverage so the floor in vitest.config.ts is actually enforced. A
      # threshold nothing runs is the same decorative gate as `eslint --quiet`.
      - run: npx vitest run --coverage
      - name: Production build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx playwright test --reporter=list
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  go-vulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    # Advisory, not gating. govulncheck reports against a live database, so a
    # CVE published overnight turns a commit that was green yesterday red
    # today with no code change — and deploy.yml gates on this whole workflow
    # (workflow_call), so an advisory would block a delivery that fixes
    # something unrelated. The report is still produced and visible on every
    # run; it is reviewed, not enforced.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      - name: Vulncheck core
        run: govulncheck ./...
        working-directory: core

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    # Advisory for the same reason as go-vulncheck, plus one of its own: the
    # audit endpoint is nondeterministic (it has failed and passed on the SAME
    # commit within minutes). A gate that flips without a code change is not a
    # gate, it is a retry button.
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bicep:
    # The Azure templates had never been compiled by anything. infra/main.bicep
    # carried a leaked shell-quoting artifact that made `bicep build` fail
    # outright, plus a handful of schema errors behind it — all of which this
    # job would have caught, and none of which any test could. Warnings are
    # errors here (--diagnostics-format) because the schema mistakes that
    # silently dropped blob soft-delete and the container securityContext were
    # warnings, not errors.
    name: Bicep Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install Bicep CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/bicep \
            https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x /usr/local/bin/bicep
          bicep --version
      - name: Build templates
        run: |
          set -euo pipefail
          status=0
          for f in infra/*.bicep; do
            echo "::group::$f"
            # BCP081 ("no types available") is informational: several resource
            # providers publish no type metadata for the api-versions used here,
            # so Bicep cannot pre-validate their properties. Everything else is
            # treated as a failure.
            if ! bicep build --stdout "$f" >/dev/null 2>/tmp/bicep.err; then
              cat /tmp/bicep.err
              echo "::error file=$f::bicep build failed"
              status=1
            elif grep -v 'BCP081' /tmp/bicep.err | grep -q .; then
              grep -v 'BCP081' /tmp/bicep.err
              echo "::error file=$f::bicep build produced warnings"
              status=1
            else
              echo "ok"
            fi
            echo "::endgroup::"
          done
          exit $status

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-tracked-binaries:
    name: No Tracked Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Verify bakicli / baki-backend are gitignored, not tracked
        run: |
          set -e
          # .gitignore lists these as build outputs. A previous regression
          # (commit 53e10e3) re-tracked bakicli; this guard prevents a repeat.
          if git ls-files | grep -E '^(bakicli|baki-backend)$'; then
            echo "::error::Tracked binary detected. Run: git rm --cached <file>"
            exit 1
          fi
          echo "OK: no tracked binaries"

  rust-lint:
    name: Rust Lint (Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: src-tauri
      # tauri-build's build script verifies the frontend dist exists, so produce
      # it before linting the Rust crate.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Format check
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  swagger-sync:
    name: Swagger Spec Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify swagger.json and swagger.yaml are in sync
        run: |
          python3 - <<'SCRIPT'
          import json, yaml, sys
          with open('docs/swagger.json') as f:
              j = json.load(f)
          with open('docs/swagger.yaml') as f:
              y = yaml.safe_load(f)
          j_paths = set(j.get('paths', {}).keys())
          y_paths = set(y.get('paths', {}).keys())
          if j_paths != y_paths:
              print(f"Path mismatch! JSON-only: {j_paths - y_paths}")
              print(f"YAML-only: {y_paths - j_paths}")
              sys.exit(1)
          # Check methods match per path
          for path in j_paths:
              j_methods = set(j['paths'][path].keys())
              y_methods = set(y['paths'][path].keys())
              if j_methods != y_methods:
                  print(f"Method mismatch on {path}! JSON: {j_methods}, YAML: {y_methods}")
                  sys.exit(1)
          print(f"OK: {len(j_paths)} paths in sync")
          SCRIPT
