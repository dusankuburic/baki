name: PAD Flow Analysis

on:
  push:
    paths:
      - '**.txt'
      - '**.pad'
  pull_request:
    paths:
      - '**.txt'
      - '**.pad'
  workflow_dispatch:
    inputs:
      flow_path:
        description: 'Path to PAD flow file or folder'
        default: '.'
      fail_on:
        description: 'Minimum severity that fails the build: error, warning, info, none'
        default: 'error'
  workflow_call:
    inputs:
      flow_path:
        type: string
        default: '.'
      fail_on:
        type: string
        default: 'error'

permissions:
  contents: read
  # Required for the analyzer to publish findings to the Security tab and to
  # annotate changed lines inline on pull requests.
  security-events: write

jobs:
  analyze:
    name: Analyze PAD Flows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze PAD flows
        uses: ./
        with:
          flow-path: ${{ inputs.flow_path || '.' }}
          fail-on: ${{ inputs.fail_on || 'error' }}
          sarif-file: pad-analysis.sarif
          upload-sarif: 'true'

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pad-analysis-sarif
          path: pad-analysis.sarif
          retention-days: 30
