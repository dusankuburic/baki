name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release-cli:
    name: Build & Release bakicli
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build bakicli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ github.ref_name || github.event.inputs.tag }}"
          [ -z "$VERSION" ] && VERSION="dev"
          go build -ldflags "-s -w -X main.version=${VERSION}" \
            -o bakicli-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/bakicli

      - name: Archive
        id: archive
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv bakicli-${{ matrix.goos }}-${{ matrix.goarch }} bakicli.exe
            zip bakicli-${{ matrix.goos }}-${{ matrix.goarch }}.zip bakicli.exe
            ext="bakicli-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          else
            tar czf bakicli-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz bakicli-${{ matrix.goos }}-${{ matrix.goarch }}
            ext="bakicli-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          fi
          echo "asset=$ext" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.archive.outputs.asset }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
