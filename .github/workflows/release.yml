name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release-cli:
    name: Build & Release bakicli
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod

      - name: Build bakicli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ github.ref_name || github.event.inputs.tag }}"
          [ -z "$VERSION" ] && VERSION="dev"
          go build -ldflags "-s -w -X main.version=${VERSION}" \
            -o bakicli-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/bakicli

      - name: Archive
        id: archive
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv bakicli-${{ matrix.goos }}-${{ matrix.goarch }} bakicli.exe
            zip bakicli-${{ matrix.goos }}-${{ matrix.goarch }}.zip bakicli.exe
            ext="bakicli-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          else
            tar czf bakicli-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz bakicli-${{ matrix.goos }}-${{ matrix.goarch }}
            ext="bakicli-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          fi
          # Per-asset SHA256 sidecar so consumers can verify integrity:
          #   sha256sum -c bakicli-<os>-<arch>.tar.gz.sha256
          sha256sum "$ext" > "$ext.sha256"
          echo "asset=$ext" >> "$GITHUB_OUTPUT"
          echo "asset_sha256=$ext.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            ${{ steps.archive.outputs.asset }}
            ${{ steps.archive.outputs.asset_sha256 }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  release-sbom:
    name: Generate & attach SBOM
    runs-on: ubuntu-latest
    needs: release-cli
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # SPDX SBOM of the Go source tree (syft via sbom-action), attached to
      # the release next to the binaries and their sha256 sidecars. Consumers
      # and scanners get a dependency inventory per tag.
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          format: spdx-json
          artifact-name: baki-sbom.spdx.json
          upload-release-asset: true

      # Sidecar for the SBOM itself, matching the binary-asset convention:
      #   sha256sum -c baki-sbom.spdx.json.sha256
      - name: Hash the SBOM
        run: sha256sum baki-sbom.spdx.json > baki-sbom.spdx.json.sha256

      - name: Attach SBOM sha256
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: baki-sbom.spdx.json.sha256
