name: Desktop Build

# Builds the Tauri desktop app for Windows — PAD itself is Windows-only, so
# that is the platform the group runs. Until this job existed the desktop
# surface shipped to nobody: it was never built in CI, and the only sidecar on
# any disk was an untracked Linux binary, so a Windows bundle could not be
# produced from a clean checkout.
#
# Deliberately a separate workflow, not a job in ci.yml: deploy.yml gates the
# cloud deploy on ci.yml (workflow_call), and a 10-minute Windows/Rust build
# should not hold a backend deploy hostage. Signing, an updater and sidecar
# hashing are out of scope — a trusted group installs by hand from the
# artifact this job uploads.
on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'src-tauri/**'
      - 'frontend/**'
      - 'core/**'
      - 'internal/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'package.json'
      - 'scripts/build-sidecar/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows bundle (MSI + NSIS)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      # The sidecar's handshake with the shell: the backend, run as the shell runs it with the per-user
      # directories at a temporary one, prints CONFIG:{port,tokenPath} on stdout, answers /healthz and stops
      # cleanly on CTRL_BREAK (killed instead when the runner gives it no console, as the shell does). Before the
      # bundle, so a broken boot fails in minutes instead of after the Rust build.
      - name: Desktop boot smoke test
        run: go test -count=1 -v -run '^TestDesktopBoot_Smoke$' .

      # Root package.json: build:sidecar (go build → src-tauri/bin/pad-backend-
      # <host-triple>.exe) then `tauri build`, whose beforeBuildCommand builds
      # the frontend. Same command a developer runs locally.
      - name: Build sidecar + Tauri bundle
        run: npm run build

      - name: Upload bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pad-analyzer-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
