# Production overlay — use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
services:
  app:
    image: ghcr.io/${GHCR_REPO:-pad-analyzer/baki}:${PAD_VERSION:-latest}
    environment:
      - PAD_AUTH_SECRET=${PAD_AUTH_SECRET:?PAD_AUTH_SECRET must be set}
      - PAD_BEHIND_PROXY=true
      - PAD_MODE=cloud
      - PAD_AUTH_ENABLED=true
      - PAD_STORAGE=database
      - PAD_DATABASE_URL=${PAD_DATABASE_URL:?PAD_DATABASE_URL must be set}
      # Set EXPLICITLY, not left to the cloud-mode default: the base file turns
      # this off so the local dev stack can talk to a TLS-less postgres
      # container, and compose merges environment keys — without this line the
      # production stack would silently inherit that and accept an unencrypted
      # database connection. Your DSN must use sslmode=require or verify-full.
      - PAD_DB_REQUIRE_SSL=true
      - PAD_ALLOWED_ORIGINS=${PAD_ALLOWED_ORIGINS:?PAD_ALLOWED_ORIGINS must be set}
      # Azure Blob Storage offload (optional). Set both to enable it (Managed
      # Identity auth); the readiness probe (/readyz) gates traffic on blob
      # reachability. Leave unset to keep flow content in Postgres.
      - PAD_AZURE_STORAGE_ACCOUNT=${PAD_AZURE_STORAGE_ACCOUNT:-}
      - PAD_AZURE_STORAGE_CONTAINER=${PAD_AZURE_STORAGE_CONTAINER:-}
    # Immutable root filesystem (H1): the backend writes nothing outside
    # /tmp (blob-offload staging); /tmp becomes a tmpfs. Combined with the
    # base file's cap_drop/no-new-privileges, a container compromise gets a
    # capability-less, read-only, non-root filesystem.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
  db:
    # Pin to an immutable digest in production (the base file's floating tag can
    # silently change). Bump deliberately when applying Postgres security
    # patches.
    #
    # Must stay on the SAME image family as the base file (pgvector), not plain
    # postgres: the `vector` extension backs knowledge-base similarity search,
    # and scripts/db-init installs it at first init. Overriding back to stock
    # postgres would make that init fail and leave search on its slow in-Go
    # fallback.
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
