# Production overlay — use:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# Adds the TLS terminator the base file's warning assumes, stops publishing the
# app's own port, and makes every credential mandatory.
services:
  # TLS terminator. The overlay used to set PAD_BEHIND_PROXY=true with nothing
  # in front of the app: that flag is the documented escape hatch from the
  # cloud-mode "auth requires TLS" check in internal/config/loader.go, so the
  # production stack served JWTs and passwords over plaintext HTTP on a
  # published port, with the one guard that would have refused to start
  # explicitly disabled. Caddy obtains and renews certificates automatically.
  #
  # Terminating TLS somewhere else instead (a cloud load balancer, an existing
  # nginx)? Then do not use this overlay's proxy — see the deployment notes in
  # README.md. Keeping PAD_BEHIND_PROXY=true without any terminator is the bug
  # this service exists to fix.
  caddy:
    image: caddy:2-alpine@sha256:040e9f7480b80b6d4a7e5013a21159b950a63dcbdb956e38abe2387fb28d9ec0
    environment:
      # Public origin, e.g. https://baki.example.com. Port 80 must be reachable
      # from the internet for the ACME HTTP challenge.
      - BAKI_SITE_ADDRESS=${BAKI_SITE_ADDRESS:?BAKI_SITE_ADDRESS must be set, e.g. https://baki.example.com}
      # Required, not optional: Caddy's `email` directive takes exactly one
      # argument, so an empty value fails the config parse and the proxy never
      # starts. Any address you actually monitor will do.
      - ACME_EMAIL=${ACME_EMAIL:?ACME_EMAIL must be set — the ACME account contact address for certificate expiry notices}
    networks:
      default:
        # Static, so the app can trust this one address and nothing else.
        ipv4_address: ${BAKI_PROXY_IP:-172.29.0.10}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account state. Without a volume every restart
      # re-requests a certificate and walks into Let's Encrypt's rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    cap_drop: [ALL]
    # Caddy binds 80 and 443 as a non-root user.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  app:
    image: ghcr.io/${GHCR_REPO:-pad-analyzer/baki}:${PAD_VERSION:-latest}
    # Reachable only through caddy on the compose network. The base file
    # publishes the app's port for local development; compose CONCATENATES
    # `ports` across files, so this has to reset the list rather than override
    # it — otherwise the app stays exposed on 8080 alongside the proxy, which
    # is precisely the plaintext path this overlay removes.
    ports: !reset []
    environment:
      - PAD_AUTH_SECRET=${PAD_AUTH_SECRET:?PAD_AUTH_SECRET must be set}
      # Dedicated at-rest key for the provider-key store. Unset, the keystore
      # falls back to PAD_AUTH_SECRET, so rotating the JWT secret would make
      # every stored AI provider key undecryptable.
      # Azure AI Foundry endpoint allow-list extras and the private-egress
      # override (see .env.example). Empty = defaults.
      - PAD_AZURE_FOUNDRY_ALLOWED_HOSTS=${PAD_AZURE_FOUNDRY_ALLOWED_HOSTS:-}
      - PAD_AI_ALLOW_PRIVATE_EGRESS=${PAD_AI_ALLOW_PRIVATE_EGRESS:-}
      # Knowledge-base embedding width and provider pin (see .env.example;
      # PAD_EMBEDDING_PROVIDER=azure-foundry is the only way the knowledge
      # base embeds with Azure AI Foundry). Empty = defaults.
      - PAD_EMBEDDING_DIM=${PAD_EMBEDDING_DIM:-}
      - PAD_EMBEDDING_PROVIDER=${PAD_EMBEDDING_PROVIDER:-}
      - PAD_ENCRYPTION_KEY=${PAD_ENCRYPTION_KEY:?PAD_ENCRYPTION_KEY must be set (a different value from PAD_AUTH_SECRET)}
      # Key rotation: the keys PAD_ENCRYPTION_KEY replaced, comma-separated, newest
      # first; set only while a rotation is under way (README, "Rotating the encryption key").
      - PAD_ENCRYPTION_KEY_PREVIOUS=${PAD_ENCRYPTION_KEY_PREVIOUS:-}
      - PAD_BEHIND_PROXY=true
      # WITHOUT THIS, EVERY CLIENT SHARES ONE RATE-LIMIT BUCKET. The app trusts
      # X-Forwarded-For only from a listed proxy; with an empty list it falls
      # back to the immediate TCP peer, which behind caddy is caddy — so the
      # general limit (1 rps) and the auth limit (5/minute) would apply to the
      # whole deployment at once, and every audit entry would record the
      # proxy's address instead of the user's.
      #
      # Exactly one address, not a private range. Anything listed here can
      # declare its own client IP via X-Forwarded-For, which means forging
      # audit-log entries and sidestepping per-IP rate limits — so the list is
      # pinned to caddy's static address below rather than to the RFC1918
      # blocks the network is allocated from, which would extend that trust to
      # every other container that can reach the app.
      - PAD_TRUSTED_PROXIES=${BAKI_PROXY_IP:-172.29.0.10}/32
      - PAD_MODE=cloud
      - PAD_AUTH_ENABLED=true
      - PAD_STORAGE=database
      - PAD_DATABASE_URL=${PAD_DATABASE_URL:?PAD_DATABASE_URL must be set}
      # Set EXPLICITLY, not left to the cloud-mode default: the base file turns
      # this off so the local dev stack can talk to a TLS-less postgres
      # container, and compose merges environment keys — without this line the
      # production stack would silently inherit that and accept an unencrypted
      # database connection. Your DSN must use sslmode=require or verify-full.
      - PAD_DB_REQUIRE_SSL=true
      - PAD_ALLOWED_ORIGINS=${PAD_ALLOWED_ORIGINS:?PAD_ALLOWED_ORIGINS must be set (the public origin, matching BAKI_SITE_ADDRESS)}
      # Public origin used to build links in password-reset and verification
      # email. Wrong or unset, those links point somewhere the user cannot
      # reach.
      - PAD_APP_BASE_URL=${PAD_APP_BASE_URL:-${BAKI_SITE_ADDRESS}}
      # Gates GET /metrics and /debug/pprof. Mandatory here because
      # PAD_BEHIND_PROXY=true makes the endpoint's private-IP allowlist pass
      # for every request — the token is the only real gate left. Caddy also
      # 404s both paths at the edge.
      - PAD_METRICS_TOKEN=${PAD_METRICS_TOKEN:?PAD_METRICS_TOKEN must be set}
      # Transactional email. Without an SMTP relay the app falls back to a
      # log-only mailer, which means password-reset and verification links are
      # written to the container log instead of being delivered.
      - PAD_SMTP_HOST=${PAD_SMTP_HOST:-}
      - PAD_SMTP_PORT=${PAD_SMTP_PORT:-587}
      - PAD_SMTP_USERNAME=${PAD_SMTP_USERNAME:-}
      - PAD_SMTP_PASSWORD=${PAD_SMTP_PASSWORD:-}
      - PAD_EMAIL_FROM=${PAD_EMAIL_FROM:-}
      # Azure Blob Storage offload (optional). Set both to enable it (Managed
      # Identity auth); the readiness probe (/readyz) gates traffic on blob
      # reachability. Leave unset to keep flow content in Postgres.
      - PAD_AZURE_STORAGE_ACCOUNT=${PAD_AZURE_STORAGE_ACCOUNT:-}
      - PAD_AZURE_STORAGE_CONTAINER=${PAD_AZURE_STORAGE_CONTAINER:-}
      # Soft heap limit for the Go GC, ~80% of the 1G memory limit under
      # deploy.resources below; change the two together. Without it the GC
      # paces by GOGC alone and ignores the container limit, so a burst of
      # large uploads can grow the heap past it and get the container
      # OOM-killed. The other 20% is for non-heap memory (goroutine stacks,
      # the runtime, the binary).
      - GOMEMLIMIT=800MiB
    # Immutable root filesystem (H1): the backend writes nothing outside
    # /tmp (blob-offload staging); /tmp becomes a tmpfs. Combined with the
    # base file's cap_drop/no-new-privileges, a container compromise gets a
    # capability-less, read-only, non-root filesystem.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          # Not '0.5': Go 1.25 floors GOMAXPROCS at 2 even when the cgroup
          # quota is below that, so with half a core every CPU-bound request
          # (analysis, PDF export, brotli) ran two runtime threads against a
          # quota that allowed one and was CFS-throttled for the rest of each
          # 100 ms period — visible as periodic ~50-100 ms stalls under load.
          # Two cores match the floor; the memory limit is unchanged.
          cpus: '2'
          memory: 1G # GOMEMLIMIT above is ~80% of this
    # Above the app's fx.StopTimeout so Docker does not SIGKILL a stop in
    # progress (see the base file). Set here as well, so the production stack
    # keeps it whatever the base file says.
    stop_grace_period: 35s
  db:
    environment:
      # No default, unlike the base file's local-dev value: an unset variable
      # must stop the stack rather than silently initialise the application role
      # with a password anyone can read in this repository. Must match the
      # credentials in PAD_DATABASE_URL above.
      #
      # Only consumed on FIRST init of an empty volume. A stack already
      # initialised from the old 01-app-role.sql has the published password and
      # needs an explicit ALTER ROLE — see scripts/db-init/01-app-role.sh.
      - BAKI_APP_PASSWORD=${BAKI_APP_PASSWORD:?BAKI_APP_PASSWORD must be set}
      # The superuser password gets the same treatment: the base file defaults
      # it to the repo-published "postgres", which would leave a known-password
      # superuser one `docker exec` away from full database control. Not
      # published and never used by the app, but a production volume must not
      # boot with it. Also only consumed on FIRST init of an empty volume —
      # existing volumes keep whatever they were initialised with.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (the superuser password; the app itself uses BAKI_APP_PASSWORD)}
    # Not published. The base file binds 127.0.0.1 for local psql access; in
    # production the database is reachable only from the compose network.
    ports: !reset []
    # Pin to an immutable digest in production (the base file's floating tag can
    # silently change). Bump deliberately when applying Postgres security
    # patches.
    #
    # Must stay on the SAME image family as the base file (pgvector), not plain
    # postgres: the `vector` extension backs knowledge-base similarity search,
    # and scripts/db-init installs it at first init. Overriding back to stock
    # postgres would make that init fail and leave search on its slow in-Go
    # fallback.
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    # Postgres's compiled-in defaults assume a machine from 2005: 128MB of
    # shared_buffers, a 4GB effective_cache_size (MORE than this container's
    # limit, so the planner over-trusts the cache), 4MB work_mem (every
    # non-trivial sort and hash spills to disk), spinning-disk random_page_cost
    # (the planner shuns the indexes), and JIT on (it costs more than it saves
    # on this schema's short OLTP statements). Sized for the 2G / 1 CPU limits
    # under deploy.resources below — scale them TOGETHER:
    #   shared_buffers       ~25% of the memory limit
    #   effective_cache_size ~75% of the memory limit
    #   work_mem             per sort/hash per query, so (max_connections x
    #                        work_mem x a few) must fit in what is left
    #   maintenance_work_mem ~5% (VACUUM, CREATE INDEX)
    # pg_stat_statements + log_min_duration_statement are the two
    # observability hooks a perf investigation needs; preloading the library
    # only allocates its shared-memory slot, the extension itself has to be
    # CREATEd in the database — scripts/db-init/02-pg-stat-statements.sql
    # does that on first init of an empty volume; an existing deployment runs
    # the same statement once by hand (see README.md).
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_wal_size=2GB
      -c checkpoint_completion_target=0.9
      -c wal_compression=on
      -c jit=off
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_min_duration_statement=500
    # Docker's default /dev/shm is 64MB; parallel workers and hash joins use
    # it for dynamic shared memory and fail with "could not resize shared
    # memory segment" once work_mem is raised. Not counted against `memory`.
    shm_size: 256m
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G # the -c settings in `command` above are sized to this

# The subnet is pinned so caddy can hold a fixed address (see
# PAD_TRUSTED_PROXIES above). Override BAKI_SUBNET and BAKI_PROXY_IP together if
# 172.29.0.0/24 collides with something already routed on the host.
networks:
  default:
    ipam:
      config:
        - subnet: ${BAKI_SUBNET:-172.29.0.0/24}

volumes:
  caddy_data:
  caddy_config:
