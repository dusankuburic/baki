# Production overlay — use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
services:
  app:
    image: ghcr.io/${GHCR_REPO:-pad-analyzer/baki}:${PAD_VERSION:-latest}
    environment:
      - PAD_AUTH_SECRET=${PAD_AUTH_SECRET:?PAD_AUTH_SECRET must be set}
      - PAD_BEHIND_PROXY=true
      - PAD_MODE=cloud
      - PAD_AUTH_ENABLED=true
      - PAD_STORAGE=database
      - PAD_DATABASE_URL=${PAD_DATABASE_URL:?PAD_DATABASE_URL must be set}
      - PAD_ALLOWED_ORIGINS=${PAD_ALLOWED_ORIGINS:?PAD_ALLOWED_ORIGINS must be set}
      # Azure Blob Storage offload (optional). Set both to enable it (Managed
      # Identity auth); the readiness probe (/readyz) gates traffic on blob
      # reachability. Leave unset to keep flow content in Postgres.
      - PAD_AZURE_STORAGE_ACCOUNT=${PAD_AZURE_STORAGE_ACCOUNT:-}
      - PAD_AZURE_STORAGE_CONTAINER=${PAD_AZURE_STORAGE_CONTAINER:-}
    # Immutable root filesystem (H1): the backend writes nothing outside
    # /tmp (blob-offload staging); /tmp becomes a tmpfs. Combined with the
    # base file's cap_drop/no-new-privileges, a container compromise gets a
    # capability-less, read-only, non-root filesystem.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
  db:
    # Pin to an immutable digest in production (the base file's floating
    # postgres:16-alpine can silently change). Bump deliberately when applying
    # Postgres security patches.
    image: postgres:16.14-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
