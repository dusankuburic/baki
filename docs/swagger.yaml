          description: A flag that is not true or false
          schema:
            $ref: '#/definitions/render.ErrorResponse'
        "404":
          description: MODEL_NOT_FOUND
          schema:
            $ref: '#/definitions/render.ErrorResponse'
        "409":
          description: REINDEX_REQUIRED or REGISTRY_READ_ONLY
          schema:
            $ref: '#/definitions/render.ErrorResponse'
        "503":
          description: AZURE_REGISTRY_UNAVAILABLE
          schema:
            $ref: '#/definitions/render.ErrorResponse'
      summary: Remove an Azure AI Foundry model
      tags:
      - providers
    get:
      description: One of the caller's own models (see GET /models).
      parameters:
      - description: 'Model id: ten characters [a-z0-9] (the id, not the m/ chat id)'
        in: path
        name: modelId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.AzureModelEnvelope'
        "404":
          description: MODEL_NOT_FOUND
          schema:
            $ref: '#/definitions/render.ErrorResponse'
        "503":
          description: SECRET_STORAGE_UNAVAILABLE or AZURE_REGISTRY_UNAVAILABLE
          schema:
            $ref: '#/definitions/render.ErrorResponse'
      summary: Get an Azure AI Foundry model
      tags:
      - providers
    put:
      consumes:
      - application/json
      description: 'An omitted field keeps its value; the id is kept whatever changes
        — its resource, kind or deployment. contextWindow and maxOutputTokens: null
        clears the override. description: "" clears it. isKnowledgeEmbedding true
        moves the knowledge-base designation to this model (409 REINDEX_REQUIRED on
        a non-empty corpus unless force is true, as for changing the designated model''s
        deployment or resource); false clears it. updatedAt, when sent, is the model''s
        updatedAt as last read (a stale one is 409 CONFLICT). Strict body, at most
        16 KiB. Audited (azure.model_save, op update).'
      parameters:
      - description: Model id
        in: path
        name: modelId
        required: true
        type: string
      - description: The changes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.AzureModelPatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.AzureModelEnvelope'
        "400":
          description: INVALID_CONFIG, INVALID_KIND, INVALID_DEPLOYMENT, INVALID_DISPLAY_NAME,
            INVALID_PURPOSE, INVALID_DESCRIPTION, INVALID_CONTEXT_WINDOW, INVALID_MAX_OUTPUT,
            INVALID_DESIGNATION or KIND_REQUIRES_PROJECT
          schema:
            $ref: '#/definitions/render.ErrorResponse'
        "404":
          description: MODEL_NOT_FOUND or CONNECTION_NOT_FOUND
          schema:
            $ref: '#/definitions/render.ErrorResponse'
        "409":
          description: DUPLICATE_MODEL (details.existingModelId), CONFLICT, REINDEX_REQUIRED
            or REGISTRY_READ_ONLY
          schema:
            $ref: '#/definitions/render.ErrorResponse'
        "503":
          description: AZURE_REGISTRY_UNAVAILABLE
          schema:
            $ref: '#/definitions/render.ErrorResponse'
      summary: Update an Azure AI Foundry model
      tags:
      - providers
  /api/providers/azure-foundry/test:
    post:
      consumes:
      - application/json
      description: 'One route for a saved or draft resource and a saved or draft model:
        {connectionId} tests a saved resource, {config} a draft one — with connectionId
        too, the stored secret carries over by the same host rules as a save — and
        model ({id} of a saved model, or a draft {kind, deployment}) tests a model
        on that resource. A resource test signs in and probes the endpoint (and the
        project) with no model call, at no cost; a chat, Claude or embedding model
        test sends one tiny request Azure bills; an agent test only looks the agent
        up — it is never run. Drafts write nothing; a saved target records its last
        test. Every test outcome is a 200 {ok, latencyMs, error?, code?}; a 4xx only
        means an invalid request. Strict body, at most 64 KiB. Rides the chat rate-limit
        bucket.'
      parameters:
      - description: What to test
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.AzureTestInput'
      produces:
      - application/json
      responses:
        "200":
          description: The outcome
          schema:
            $ref: '#/definitions/service.AzureTestResult'
        "400":
          description: INVALID_CONFIG, a draft's settings code (INVALID_ENDPOINT,
            HOST_NOT_ALLOWED, INVALID_PROJECT_ENDPOINT, INVALID_AUTH or MISSING_SECRET
            with details.field), or a draft model's INVALID_KIND or INVALID_DEPLOYMENT
          schema:
            $ref: '#/definitions/render.ErrorResponse'
        "404":
          description: CONNECTION_NOT_FOUND or MODEL_NOT_FOUND
          schema:
            $ref: '#/definitions/render.ErrorResponse'
        "503":
          description: SECRET_STORAGE_UNAVAILABLE or AZURE_REGISTRY_UNAVAILABLE
          schema:
            $ref: '#/definitions/render.ErrorResponse'
      summary: Test an Azure AI Foundry resource or model
      tags:
      - providers
