  /api/providers/local/config:
    get:
      description: 'Returns whether a local OpenAI-compatible server (Foundry Local,
        Ollama, LM Studio) is configured, its loopback base URL and the stored context
        window in tokens (omitted when unset: 8192 applies). Desktop app only: 400
        LOCAL_MODELS_UNAVAILABLE when the deployment does not allow loopback egress
        (cloud), so a client hides the feature there.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ai.LocalPublicConfig'
        "400":
          description: LOCAL_MODELS_UNAVAILABLE
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get local models configuration
      tags:
      - providers
    post:
      consumes:
      - application/json
      description: Validates and stores the base URL of a locally hosted OpenAI-compatible
        server and, optionally, the context window history is trimmed to (omitted
        or 0 = 8192 tokens; else 1024..2000000). Loopback http(s) only (127.0.0.1
        or [::1]; a trailing /v1 is accepted); desktop app only. 400 LOCAL_MODELS_UNAVAILABLE
        when the deployment does not allow loopback egress (cloud), INVALID_BASE_URL
        for a bad URL or body, INVALID_CONTEXT_WINDOW for a window out of range or
        not a whole number. Remove with POST /api/keys/delete; test with POST /api/providers/test.
      parameters:
      - description: The base URL and optional context window
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.localConfigSaveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: LOCAL_MODELS_UNAVAILABLE, INVALID_BASE_URL or INVALID_CONTEXT_WINDOW
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Save local models configuration
      tags:
      - providers
  /api/providers/test:
