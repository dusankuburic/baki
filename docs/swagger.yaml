basePath: /
info:
  contact: {}
  description: Static analysis, auto-fix, and AI-assisted review for Power Automate
    Desktop flows.
  title: PAD Analyzer API
  version: "1.0"
paths:
  /api/admin/audit:
    get:
      description: Returns the audit trail (logins, settings changes, admin actions).
      produces:
      - application/json
      responses:
        "200":
          description: Audit entries
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List audit log entries
      tags:
      - admin
  /api/admin/ingester/ingest:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ingest from PAD cloud
      tags:
      - admin
  /api/admin/migration/start:
    post:
      description: Kicks off the local→database flow migration (admin only, cloud
        mode). Idempotent and non-blocking.
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start data migration
      tags:
      - admin
  /api/admin/migration/status:
    get:
      description: Returns the status/result of the most recent data migration (admin
        only).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Data migration status
      tags:
      - admin
  /api/admin/powerplatform/poll:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Poll Power Platform OAuth
      tags:
      - admin
  /api/admin/powerplatform/start:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start Power Platform OAuth
      tags:
      - admin
  /api/admin/powerplatform/status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: Status
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Power Platform connection status
      tags:
      - admin
  /api/admin/scanner/scan:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Run environment scanner
      tags:
      - admin
  /api/admin/system/health:
    get:
      description: handleAdminSystemHealth returns a structured per-subsystem health
        breakdown. Admin-only (the public /readyz is the orchestrator-facing verdict).
        Reuses the same probes as readiness but reports each independently rather
        than collapsing to one pass/fail, and does NOT apply the consecutive-failure
        smoothing — an admin querying health wants the live picture, not a flap-dampened
        one.
      produces:
      - application/json
      responses:
        "200":
          description: Health detail
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Detailed system health
      tags:
      - admin
  /api/admin/users/{id}/role:
    put:
      consumes:
      - application/json
      description: Changes the role of the user with the given ID (admin only).
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Role payload
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set a user role
      tags:
      - admin
  /api/admin/users/list:
    get:
      description: Returns a list of all registered users. Only available to system
        admins.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all users
      tags:
      - admin
  /api/analysis/analyze:
    post:
      description: Runs all enabled analysis rules on the current flow document.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Analyze current flow
      tags:
      - analysis
  /api/analysis/analyze-raw:
    post:
      consumes:
      - application/json
      description: 'handleAnalyzeRaw analyzes raw PAD flow text WITHOUT requiring
        a pre-stored flow, so CI pipelines and wrappers can POST flow text and get
        findings JSON (or SARIF) back in one call — no library upload, no Go CLI install.
        Works in both modes (auth via PAT in cloud; open in local). Body: {files,
        name, format?} where format is "json" (default) or "sarif". Nothing is persisted.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Analyze raw PAD source
      tags:
      - analysis
  /api/analysis/baseline/clear:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
