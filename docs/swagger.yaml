basePath: /
definitions:
  ai.AzureFoundryAuth:
    properties:
      clientId:
        type: string
      clientSecret:
        type: string
      key:
        description: Key is the resource API key (AzureAuthModeAPIKey).
        type: string
      mode:
        type: string
      tenantId:
        description: TenantID, ClientID and ClientSecret describe the app registration
          (AzureAuthModeEntra).
        type: string
    type: object
  ai.AzureFoundryConfig:
    properties:
      auth:
        $ref: '#/definitions/ai.AzureFoundryAuth'
      chatDeployment:
        description: |-
          ChatDeployment is the deployment offered as the default model; EmbeddingDeployment (optional) the
          knowledge-base one; Deployments (≤ azureMaxDeployments) further chat deployments — an API-key caller's
          deployments are not listable, so the picker shows exactly these names. Saving requires a chat deployment
          unless the project listing can supply one (MISSING_DEPLOYMENT).
        type: string
      claudeDeployments:
        description: |-
          ClaudeDeployments (≤ azureMaxClaudeDeployments) answer on the Anthropic Messages route
          ({endpoint}/anthropic/v1/messages), not /openai/v1 (404); offered as "claude:<name>" and also discovered
          by the project listing (modelPublisher "Anthropic").
        items:
          type: string
        type: array
      deployments:
        items:
          type: string
        type: array
      embeddingDeployment:
        type: string
      endpoint:
        description: Endpoint is the resource endpoint, e.g. https://my-res.openai.azure.com
          or https://my-res.services.ai.azure.com (no path).
        type: string
      projectEndpoint:
        description: |-
          ProjectEndpoint (optional) is the Foundry project endpoint, https://<res>.services.ai.azure.com/api/projects/<project>,
          which unlocks the project's agents (Entra ID only) and deployment metadata.
        type: string
    type: object
  ai.AzureFoundryPublicConfig:
    properties:
      authMode:
        type: string
      chatDeployment:
        type: string
      claudeDeployments:
        items:
          type: string
        type: array
      clientId:
        type: string
      configured:
        type: boolean
      deployments:
        items:
          type: string
        type: array
      embeddingDeployment:
        type: string
      endpoint:
        type: string
      hasSecret:
        type: boolean
      projectEndpoint:
        type: string
      tenantId:
        type: string
    type: object
  ai.LocalPublicConfig:
    properties:
      baseUrl:
        type: string
      configured:
        type: boolean
      contextWindow:
        description: |-
          ContextWindow is the STORED window in tokens, omitted when unset (the
          provider then uses LocalDefaultContextWindow, 8192).
        type: integer
    type: object
  api.conversationResponse:
    properties:
      activeStreamId:
        description: |-
          ActiveStreamID is the caller's stream whose answer is not yet stored (live, or finished and
          still being stored); omitted once the answer is stored.
        type: string
      messages:
        items:
          $ref: '#/definitions/pad-core_models.ChatMessage'
        type: array
    type: object
  api.identityLinkView:
    properties:
      createdAt:
        type: string
      email:
        type: string
      provider:
        type: string
    type: object
  api.knowledgeReindexRequest:
    properties:
      cursor:
        $ref: '#/definitions/interfaces.KnowledgeChunkCursor'
      force:
        type: boolean
    type: object
  api.localConfigSaveRequest:
    properties:
      baseUrl:
        example: http://127.0.0.1:11434/v1
        type: string
      contextWindow:
        example: 32768
        type: integer
    type: object
  api.orgAzureFoundrySaveRequest:
    properties:
      auth:
        $ref: '#/definitions/ai.AzureFoundryAuth'
      chatDeployment:
        description: |-
          ChatDeployment is the deployment offered as the default model; EmbeddingDeployment (optional) the
          knowledge-base one; Deployments (≤ azureMaxDeployments) further chat deployments — an API-key caller's
          deployments are not listable, so the picker shows exactly these names. Saving requires a chat deployment
          unless the project listing can supply one (MISSING_DEPLOYMENT).
        type: string
      claudeDeployments:
        description: |-
          ClaudeDeployments (≤ azureMaxClaudeDeployments) answer on the Anthropic Messages route
          ({endpoint}/anthropic/v1/messages), not /openai/v1 (404); offered as "claude:<name>" and also discovered
          by the project listing (modelPublisher "Anthropic").
        items:
          type: string
        type: array
      deployments:
        items:
          type: string
        type: array
      embeddingDeployment:
        type: string
      endpoint:
        description: Endpoint is the resource endpoint, e.g. https://my-res.openai.azure.com
          or https://my-res.services.ai.azure.com (no path).
        type: string
      projectEndpoint:
        description: |-
          ProjectEndpoint (optional) is the Foundry project endpoint, https://<res>.services.ai.azure.com/api/projects/<project>,
          which unlocks the project's agents (Entra ID only) and deployment metadata.
        type: string
      updatedAt:
        type: string
    type: object
  api.orgAzureFoundrySaveResponse:
    properties:
      status:
        example: ok
        type: string
      updatedAt:
        type: string
    type: object
  api.orgMemberMutationResponse:
    properties:
      sharedCredentialDisabled:
        type: boolean
      status:
        example: ok
        type: string
    type: object
  api.roleCounts:
    properties:
      admin:
        type: integer
      guest:
        type: integer
      member:
        type: integer
      none:
        type: integer
      viewer:
        type: integer
    type: object
  api.statusResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  api.userStatsView:
    properties:
      byRole:
        $ref: '#/definitions/api.roleCounts'
      locked:
        type: integer
      total:
        type: integer
      unverified:
        type: integer
    type: object
  auth.Role:
    enum:
    - admin
    - member
    - viewer
    - guest
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleMember
    - RoleViewer
    - RoleGuest
  interfaces.KnowledgeChunkCursor:
    properties:
      docId:
        type: string
      id:
        type: string
    type: object
  interfaces.User:
    properties:
      avatarUrl:
        type: string
      createdAt:
        type: string
      displayName:
        type: string
      email:
        type: string
      emailVerified:
        type: boolean
      id:
        type: string
      role:
        $ref: '#/definitions/auth.Role'
      updatedAt:
        type: string
    type: object
  pad-core_models.ChatMessage:
    properties:
      content:
        type: string
      contextBlockId:
        type: string
      contextSubflowId:
        type: string
      finishReason:
        type: string
      fixProposal:
        allOf:
        - $ref: '#/definitions/pad-core_models.FixProposalSnapshot'
        description: |-
          FixProposal snapshots the single apply_fix approval record — LEGACY,
          superseded by FixProposals; kept for pre-migration conversations.
      fixProposals:
        description: |-
          FixProposals snapshots every apply_fix/apply_fixes approval record: a
          stream can carry several sequential proposals, a batch several fixes.
        items:
          $ref: '#/definitions/pad-core_models.FixProposalSnapshot'
        type: array
      id:
        type: string
      inputCostPerM:
        type: number
      model:
        type: string
      modelLabel:
        description: |-
          ModelLabel is the model's friendly name at send time (Model is the opaque
          "m/<entryId>"), so history and exports keep naming it after renames;
          empty for catalogue models.
        type: string
      outputCostPerM:
        type: number
      provider:
        type: string
      role:
        type: string
      servedModel:
        description: |-
          ServedModel is the model that actually answered when Model is a resolvable
          alias, and Input/OutputCostPerM the USD per 1M rates billed — all from the
          stream's done event, so a reloaded conversation prices the turn at what it
          cost. Zero/empty = not reported.
        type: string
      timestamp:
        type: string
      tokensIn:
        type: integer
      tokensOut:
        type: integer
      toolCalls:
        description: ToolCalls records the tool invocations behind this assistant
          message.
        items:
          $ref: '#/definitions/pad-core_models.ToolCallRecord'
        type: array
    type: object
  pad-core_models.ContextPreview:
    properties:
      contextLimit:
        type: integer
      contextText:
        type: string
      estimatedTokens:
        type: integer
      systemPrompt:
        type: string
      userMessage:
        type: string
    type: object
  pad-core_models.FixItemSnapshot:
    properties:
      blockLabel:
        type: string
      fixType:
        type: string
      line:
        type: integer
      message:
        type: string
      ruleId:
        type: string
      status:
        type: string
      summary:
        type: string
    type: object
  pad-core_models.FixProposalSnapshot:
    properties:
      blockLabel:
        type: string
      fixType:
        type: string
      items:
        items:
          $ref: '#/definitions/pad-core_models.FixItemSnapshot'
        type: array
      line:
        type: integer
      message:
        type: string
      proposalId:
        type: string
      ruleId:
        type: string
      status:
        type: string
      summary:
        type: string
    type: object
  pad-core_models.ToolCallRecord:
    properties:
      durationMs:
        type: integer
      label:
        type: string
      name:
        type: string
      ok:
        type: boolean
      summary:
        type: string
    type: object
  rag.ReindexResult:
    properties:
      chunks:
        type: integer
      docs:
        type: integer
      nextCursor:
        $ref: '#/definitions/interfaces.KnowledgeChunkCursor'
      truncated:
        type: boolean
    type: object
  render.ErrorResponse:
    properties:
      code:
        type: string
      details:
        additionalProperties: {}
        type: object
      message:
        type: string
      requestId:
        type: string
    type: object
  render.PagedResponse-interfaces_User:
    properties:
      items:
        items:
          $ref: '#/definitions/interfaces.User'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  service.AzureConnectionConfigInput:
    properties:
      auth:
        $ref: '#/definitions/ai.AzureFoundryAuth'
      endpoint:
        type: string
      projectEndpoint:
        type: string
    type: object
  service.AzureConnectionConfigView:
    properties:
      authMode:
        type: string
      clientId:
        type: string
      endpoint:
        type: string
      hasSecret:
        type: boolean
      projectEndpoint:
        type: string
      tenantId:
        type: string
    type: object
  service.AzureConnectionDeleteResult:
    properties:
      clearedKnowledgeEmbedding:
        type: boolean
      deletedModels:
        type: integer
      status:
        type: string
    type: object
  service.AzureConnectionEnvelope:
    properties:
      connection:
        $ref: '#/definitions/service.AzureConnectionView'
    type: object
  service.AzureConnectionInput:
    properties:
      config:
        $ref: '#/definitions/service.AzureConnectionConfigInput'
      name:
        description: Name is the resource's display name; "" takes the endpoint host's
          first label.
        type: string
    type: object
  service.AzureConnectionPatch:
    properties:
      config:
        $ref: '#/definitions/service.AzureConnectionConfigInput'
      credentialUpdatedAt:
        description: 'CredentialUpdatedAt (org scope): the CAS on the org''s stored
          credential.'
        type: string
      dismissDiscovery:
        description: DismissDiscovery hides (true) or brings back (false) the "Found
          in your project" prompt.
        type: boolean
      force:
        description: Force confirms the re-index an endpoint change of the KB model's
          resource needs (else 409 REINDEX_REQUIRED).
        type: boolean
      name:
        type: string
      updatedAt:
        description: 'UpdatedAt is the resource''s last-read updatedAt: a stale value
          is 409 CONFLICT.'
        type: string
    type: object
  service.AzureConnectionView:
    properties:
      canDiscover:
        description: 'CanDiscover and SupportsAgents: Entra ID (or the Azure CLI)
          with a project endpoint.'
        type: boolean
      config:
        $ref: '#/definitions/service.AzureConnectionConfigView'
      credentialUpdatedAt:
        description: CredentialUpdatedAt (org scope) is the stored credential's compare-and-swap
          token.
        type: string
      id:
        type: string
      lastTest:
        $ref: '#/definitions/service.AzureLastTestView'
      legacy:
        description: Legacy marks the resource the single-document configuration became.
        type: boolean
      modelCount:
        type: integer
      name:
        description: Name is the resource's display name (1–64 characters).
        type: string
      orgId:
        type: string
      orgName:
        type: string
      shared:
        description: 'Shared marks an organisation''s resource: org scope always,
          user scope read-only ("Shared with you").'
        type: boolean
      sharedBy:
        description: SharedBy names who lent a shared resource's credential (display
          name, else email); SharedByID is that admin's id.
        type: string
      status:
        type: string
      statusReason:
        type: string
      suggestDiscovery:
        description: SuggestDiscovery shows the "Found in your project" prompt when
          discoverable and not dismissed.
        type: boolean
      supportsAgents:
        type: boolean
      updatedAt:
        description: UpdatedAt is the registry row's compare-and-swap token (RFC 3339).
        type: string
    type: object
  service.AzureConnectionsListing:
    properties:
      connections:
        items:
          $ref: '#/definitions/service.AzureConnectionView'
        type: array
      knowledgeEmbeddingEnabled:
        type: boolean
      limits:
        $ref: '#/definitions/service.AzureRegistryLimits'
      recoveredCopyPath:
        description: RecoveredCopyPath is where the recovered desktop list file's
          copy was kept (recovered only).
        type: string
      registryState:
        description: RegistryState is ok, read_only (a newer app wrote the desktop
          list file) or recovered (a corrupt one set aside, copy kept).
        type: string
    type: object
  service.AzureDiscoveryItemView:
    properties:
      alreadyAdded:
        description: 'AlreadyAdded: the resource registers it already, as ModelID.'
        type: boolean
      contextWindow:
        type: integer
      deployment:
        description: Deployment (agents) is the project deployment the agent runs
          on; Workflow marks a workflow agent.
        type: string
      kind:
        description: 'Kind is what it would be added as: chat, claude or embedding
          for a deployment, agent for an agent.'
        type: string
      model:
        description: Model is the model behind it ("" when unknown).
        type: string
      modelId:
        type: string
      name:
        type: string
      workflow:
        type: boolean
    type: object
  service.AzureDiscoveryView:
    properties:
      agents:
        items:
          $ref: '#/definitions/service.AzureDiscoveryItemView'
        type: array
      code:
        type: string
      deployments:
        items:
          $ref: '#/definitions/service.AzureDiscoveryItemView'
        type: array
      error:
        type: string
      warnings:
        items:
          type: string
        type: array
    type: object
  service.AzureLastTestView:
    properties:
      at:
        type: string
      error:
        type: string
      latencyMs:
        type: integer
      ok:
        type: boolean
    type: object
  service.AzureModelEnvelope:
    properties:
      model:
        $ref: '#/definitions/service.AzureModelView'
    type: object
  service.AzureModelInput:
    properties:
      connectionId:
        type: string
      contextWindow:
        description: |-
          ContextWindow and MaxOutputTokens are optional overrides (0 = none;
          never on an embedding model).
        type: integer
      deployment:
        type: string
      description:
        type: string
      displayName:
        description: DisplayName defaults to the deployment name; Purpose to general.
        type: string
      force:
        description: |-
          Force confirms the re-index a new knowledge-base model needs on a
          non-empty corpus (else 409 REINDEX_REQUIRED).
        type: boolean
      isDefault:
        description: |-
          IsDefault (org scope only) = the organisation's "Default for members";
          IsKnowledgeEmbedding (embedding model, KB embeds with Azure) = the KB's model.
        type: boolean
      isKnowledgeEmbedding:
        type: boolean
      kind:
        type: string
      maxOutputTokens:
        type: integer
      purpose:
        type: string
      purposeCustom:
        type: string
    type: object
  service.AzureModelPatch:
    properties:
      connectionId:
        type: string
      contextWindow:
        description: |-
          ContextWindow and MaxOutputTokens: null clears the override; the
          swaggertype tags document the integer-or-null wire form (OptionalInt).
        type: integer
        x-nullable: true
      deployment:
        type: string
      description:
        description: 'Description: "" clears it.'
        type: string
      displayName:
        type: string
      force:
        description: |-
          Force confirms the re-index a knowledge-base change needs on a
          non-empty corpus (else 409 REINDEX_REQUIRED).
        type: boolean
      isDefault:
        description: |-
          IsDefault / IsKnowledgeEmbedding: true moves the designation to this
          model, false clears it from it.
        type: boolean
      isKnowledgeEmbedding:
        type: boolean
      kind:
        type: string
      maxOutputTokens:
        type: integer
        x-nullable: true
      purpose:
        description: |-
          Purpose: a preset clears the stored custom text; "custom" takes
          PurposeCustom (or keeps the stored text).
        type: string
      purposeCustom:
        type: string
      updatedAt:
        description: |-
          UpdatedAt, when sent, is the model's updatedAt as last read
          (compare-and-swap: a stale value is 409 CONFLICT).
        type: string
    type: object
  service.AzureModelView:
    properties:
      connectionId:
        type: string
      connectionName:
        type: string
      contextWindow:
        description: ContextWindow/MaxOutputTokens are the user's overrides; ReportedContextWindow
          is the server-known window.
        type: integer
      deployment:
        description: Deployment is the deployment name, or the agent's name.
        type: string
      description:
        type: string
      displayName:
        type: string
      id:
        type: string
      isDefault:
        type: boolean
      isKnowledgeEmbedding:
        type: boolean
      kind:
        type: string
      lastTest:
        $ref: '#/definitions/service.AzureLastTestView'
      maxOutputTokens:
        type: integer
      modelId:
        type: string
      orgId:
        type: string
      orgName:
        type: string
      purpose:
        type: string
      purposeCustom:
        type: string
      reportedContextWindow:
        type: integer
      shared:
        type: boolean
      status:
        type: string
      statusReason:
        type: string
      target:
        description: 'Target is what the server routes to: "<deployment>", "claude:<deployment>"
          or "agent:<name>".'
        type: string
      updatedAt:
        type: string
    type: object
  service.AzureModelsListing:
    properties:
      models:
        items:
          $ref: '#/definitions/service.AzureModelView'
        type: array
      serverDefault:
        type: string
    type: object
  service.AzureRegistryLimits:
    properties:
      connections:
        type: integer
      models:
        type: integer
    type: object
  service.AzureTestInput:
    properties:
      config:
        $ref: '#/definitions/service.AzureConnectionConfigInput'
      connectionId:
        type: string
      model:
        $ref: '#/definitions/service.AzureTestModelRef'
    type: object
  service.AzureTestModelRef:
    properties:
      deployment:
        type: string
      id:
        type: string
      kind:
        type: string
    type: object
  service.AzureTestResult:
    properties:
      code:
        type: string
      error:
        type: string
      latencyMs:
        type: integer
      ok:
        type: boolean
    type: object
  service.OrgAzureFoundryConfig:
    properties:
      authMode:
        type: string
      chatDeployment:
        type: string
      claudeDeployments:
        items:
          type: string
        type: array
      clientId:
        type: string
      configured:
        type: boolean
      deployments:
        items:
          type: string
        type: array
      embeddingDeployment:
        type: string
      endpoint:
        type: string
      hasSecret:
        type: boolean
      projectEndpoint:
        type: string
      shared:
        type: boolean
      tenantId:
        type: string
      updatedAt:
        type: string
      updatedBy:
        type: string
    type: object
info:
  contact: {}
  description: Static analysis, auto-fix, and AI-assisted review for Power Automate
    Desktop flows.
  title: PAD Analyzer API
  version: "1.0"
paths:
  /api/admin/audit:
    get:
      description: Returns the audit trail (logins, settings changes, admin actions),
        newest first. GET /api/admin/audit/actions lists the action values.
      parameters:
      - description: Only this action (e.g. auth.login)
        in: query
        name: action
        type: string
      - description: Only events by this user ID, or whose subject is this user (sign-ins,
          failed sign-ins, lockouts)
        in: query
        name: userId
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Rows to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Audit entries
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: Invalid limit or offset
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: No storage backend (local mode)
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List audit log entries
      tags:
      - admin
  /api/admin/audit/actions:
    get:
      description: Returns every audit action string the server can emit, so the admin
        filter offers the full set instead of a hand-maintained subset.
      produces:
      - application/json
      responses:
        "200":
          description: Actions
          schema:
            items:
              type: string
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List audit action names
      tags:
      - admin
  /api/admin/migration/start:
    post:
      description: Copies flows, settings and chat conversations from a legacy filesystem-backed
        server's data directory (PAD_DATA_DIR) into the database (admin only, cloud
        mode). Idempotent and non-blocking; the status result lists what is not migrated.
        Users are not migrated, so flows whose recorded owner is absent here are assigned
        to the admin who starts the run (reported as FlowsAdopted).
      produces:
      - application/json
      responses:
        "200":
          description: Started
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Migration not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start data migration
      tags:
      - admin
  /api/admin/migration/status:
    get:
      description: Returns the status/result of the most recent data migration (admin
        only).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Data migration status
      tags:
      - admin
  /api/admin/scanner/scan:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Run environment scanner
      tags:
      - admin
  /api/admin/system/health:
    get:
      description: handleAdminSystemHealth returns a structured per-subsystem health
        breakdown. Admin-only (the public /readyz is the orchestrator-facing verdict).
        Reuses the same probes as readiness but reports each independently rather
        than collapsing to one pass/fail, and does NOT apply the consecutive-failure
        smoothing — an admin querying health wants the live picture, not a flap-dampened
        one.
      produces:
      - application/json
      responses:
        "200":
          description: Health detail
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
