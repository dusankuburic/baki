  /api/chat/get:
    post:
      consumes:
      - application/json
      description: 'Retrieves the chat history for a specific flow and conversation
        key (the wire field is historically named `provider`). The body is an object
        — {messages: [...]} (always an array) plus activeStreamId when the caller
        has a stream on this conversation whose question is stored but whose answer
        is not yet (live, or finished and still being stored) — so a client that reloads
        mid-turn can re-attach via /api/chat/resume instead of losing the answer until
        another reload. The frontend still accepts the bare array older servers answered
        with.'
      parameters:
      - description: request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.conversationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get conversation history
      tags:
      - chat
  /api/chat/preview-context:
    post:
      consumes:
      - application/json
      description: 'Returns a preview of the context that will be sent to the AI provider:
        the system prompt, the context text, the user message, an estimate of their
        tokens and the model''s context window. The model resolves as the turn''s
        would: for provider azure-foundry a model registry id the caller cannot use
        is refused with 400 and code MODEL_NOT_AVAILABLE.'
      parameters:
      - description: request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pad-core_models.ContextPreview'
        "400":
          description: 'Bad Request (code MODEL_NOT_AVAILABLE: the Azure AI Foundry
            model is not available to the caller)'
          schema:
            $ref: '#/definitions/render.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Preview AI context
      tags:
      - chat
  /api/chat/resume:
    post:
      consumes:
      - application/json
      description: Reconnect to an in-flight AI stream and catch up on missed chunks.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
