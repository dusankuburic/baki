basePath: /
definitions:
  ai.DeviceAuthResponse:
    properties:
      device_code:
        type: string
      expires_in:
        type: integer
      interval:
        type: integer
      user_code:
        type: string
      verification_uri:
        type: string
    type: object
  ai.GitHubAuthResult:
    properties:
      error:
        type: string
      status:
        type: string
      token:
        type: string
    type: object
  ai.GitHubUser:
    properties:
      login:
        type: string
      name:
        type: string
    type: object
  api.libraryFlow:
    properties:
      blockCount:
        type: integer
      description:
        type: string
      id:
        type: string
      isSharedWithMe:
        type: boolean
      name:
        type: string
      ownerDisplayName:
        type: string
      ownerId:
        type: string
      subflowCount:
        type: integer
      updatedAt:
        type: string
    type: object
  auth.Role:
    enum:
    - admin
    - member
    - viewer
    - guest
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleMember
    - RoleViewer
    - RoleGuest
  interfaces.Collaborator:
    properties:
      email:
        type: string
      grantedAt:
        type: string
      permission:
        type: string
      userId:
        type: string
    type: object
  interfaces.OrgMember:
    properties:
      joinedAt:
        type: string
      role:
        $ref: '#/definitions/auth.Role'
      userId:
        type: string
    type: object
  interfaces.Organisation:
    properties:
      createdAt:
        type: string
      id:
        type: string
      members:
        items:
          $ref: '#/definitions/interfaces.OrgMember'
        type: array
      name:
        type: string
      ownerId:
        type: string
      updatedAt:
        type: string
    type: object
  interfaces.User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      role:
        $ref: '#/definitions/auth.Role'
      updatedAt:
        type: string
    type: object
  models.AIProviderConfig:
    properties:
      contextTokenBudget:
        type: integer
      defaultModel:
        type: string
      enabled:
        type: boolean
      maxTokens:
        type: integer
      temperature:
        type: number
    type: object
  models.AISettings:
    properties:
      activeProvider:
        type: string
      demoMode:
        $ref: '#/definitions/models.DemoModeSettings'
      providers:
        additionalProperties:
          $ref: '#/definitions/models.AIProviderConfig'
        type: object
      saveConversationHistory:
        type: boolean
      showCostEstimates:
        type: boolean
      systemPromptSuffix:
        type: string
    type: object
  models.AnalysisReport:
    properties:
      durationMs:
        type: integer
      findings:
        items:
          $ref: '#/definitions/models.Finding'
        type: array
      flowId:
        type: string
      generatedAt:
        type: string
      stats:
        $ref: '#/definitions/models.AnalysisStats'
    type: object
  models.AnalysisSettings:
    properties:
      autoAnalyzeOnOpen:
        type: boolean
      rules:
        additionalProperties:
          $ref: '#/definitions/models.RuleConfig'
        type: object
    type: object
  models.AnalysisStats:
    properties:
      blocksAnalyzed:
        type: integer
      errors:
        type: integer
      info:
        type: integer
      rulesRun:
        type: integer
      warnings:
        type: integer
    type: object
  models.AppSettings:
    properties:
      ai:
        $ref: '#/definitions/models.AISettings'
      analysis:
        $ref: '#/definitions/models.AnalysisSettings'
      appearance:
        $ref: '#/definitions/models.AppearanceSettings'
      general:
        $ref: '#/definitions/models.GeneralSettings'
      layout:
        $ref: '#/definitions/models.LayoutSettings'
      parser:
        $ref: '#/definitions/models.ParserSettings'
      recentFiles:
        items:
          $ref: '#/definitions/models.RecentFile'
        type: array
      version:
        type: integer
    type: object
  models.AppearanceSettings:
    properties:
      codeFont:
        type: string
      density:
        type: string
      highContrast:
        type: boolean
      reduceMotion:
        type: boolean
      theme:
        $ref: '#/definitions/models.ThemeMode'
      uiFont:
        type: string
    type: object
  models.Block:
    properties:
      children:
        items:
          $ref: '#/definitions/models.Block'
        type: array
      id:
        type: string
      indent:
        type: integer
      lineNumber:
        type: integer
      name:
        type: string
      parentId:
        type: string
      properties:
        additionalProperties:
          type: string
        type: object
      rawType:
        type: string
      subflowId:
        type: string
      tokens:
        items:
          $ref: '#/definitions/models.BlockToken'
        type: array
      type:
        $ref: '#/definitions/models.BlockType'
      variables:
        items:
          type: string
        type: array
    type: object
  models.BlockDiff:
    properties:
      change:
        $ref: '#/definitions/models.ChangeType'
      new:
        $ref: '#/definitions/models.Block'
      old:
        allOf:
        - $ref: '#/definitions/models.Block'
        description: For Modified, we might have both. For Added only New. For Removed only Old.
    type: object
  models.BlockToken:
    properties:
      target:
        description: The ID or name of the target (subflow name, variable name, etc.)
        type: string
      type:
        description: '"text", "variable", "subflow", "label"'
        type: string
      value:
        description: The text to display
        type: string
    type: object
  models.BlockType:
    enum:
    - ACTION
    - LOOP
    - CONDITION
    - SUBFLOW
    - ERROR_HANDLER
    - COMMENT
    - VARIABLE
    - WAIT
    - ELSE
    - CASE
    - DEFAULT
    - BLOCK
    - SWITCH
    - END
    - UNKNOWN
    type: string
    x-enum-varnames:
    - BlockTypeAction
    - BlockTypeLoop
    - BlockTypeCondition
    - BlockTypeSubflow
    - BlockTypeErrorHandler
    - BlockTypeComment
    - BlockTypeVariable
    - BlockTypeWait
    - BlockTypeElse
    - BlockTypeCase
    - BlockTypeDefault
    - BlockTypeBlock
    - BlockTypeSwitch
    - BlockTypeEnd
    - BlockTypeUnknown
  models.ChangeType:
    enum:
    - none
    - added
    - removed
    - modified
    type: string
    x-enum-varnames:
    - ChangeNone
    - ChangeAdded
    - ChangeRemoved
    - ChangeModified
  models.ChatMessage:
    properties:
      content:
        type: string
      contextBlockId:
        type: string
      contextSubflowId:
        type: string
      finishReason:
        type: string
      id:
        type: string
      model:
        type: string
      provider:
        type: string
      role:
        type: string
      timestamp:
        type: string
      tokensIn:
        type: integer
      tokensOut:
        type: integer
    type: object
  models.ChatRequest:
    properties:
      contextBlockId:
        type: string
      demoMode:
        type: boolean
      flowId:
        type: string
      maxTokens:
        type: integer
      messages:
        items:
          $ref: '#/definitions/models.ChatMessage'
        type: array
      model:
        type: string
      provider:
        type: string
      selectedSourceFiles:
        items:
          type: string
        type: array
      systemPrompt:
        type: string
      temperature:
        type: number
      userMessage:
        type: string
    type: object
  models.DemoModeSettings:
    properties:
      dailyLimit:
        type: integer
      dailyUsed:
        type: integer
      enabled:
        type: boolean
      resetDate:
        type: string
    type: object
  models.Finding:
    properties:
      autoFixHint:
        type: string
      blockId:
        type: string
      description:
        type: string
      id:
        type: string
      metadata:
        additionalProperties: true
        type: object
      ruleId:
        type: string
      severity:
        $ref: '#/definitions/models.Severity'
      subflowId:
        type: string
      suggestion:
        type: string
      title:
        type: string
    type: object
  models.FlowDiff:
    properties:
      newId:
        type: string
      oldId:
        type: string
      subflows:
        items:
          $ref: '#/definitions/models.SubflowDiff'
        type: array
    type: object
  models.FlowDocument:
    properties:
      filePath:
        type: string
      files:
        items:
          $ref: '#/definitions/models.FlowFileInfo'
        type: array
      id:
        type: string
      isFolder:
        type: boolean
      metadata:
        $ref: '#/definitions/models.FlowMetadata'
      name:
        type: string
      parseErrors:
        items:
          $ref: '#/definitions/models.ParseError'
        type: array
      subflows:
        items:
          $ref: '#/definitions/models.Subflow'
        type: array
    type: object
  models.FlowFileInfo:
    properties:
      name:
        type: string
      path:
        type: string
      size:
        type: integer
    type: object
  models.FlowMetadata:
    properties:
      blockCount:
        type: integer
      fileSize:
        type: integer
      maxDepth:
        type: integer
      parsedAt:
        type: string
      rawLineCount:
        type: integer
      subflowCount:
        type: integer
    type: object
  models.FrontendError:
    properties:
      componentStack:
        type: string
      message:
        type: string
      stack:
        type: string
      url:
        type: string
    type: object
  models.GeneralSettings:
    properties:
      checkForUpdates:
        type: string
      firstRunCompleted:
        type: boolean
      lastUsedVersion:
        type: string
      openInNewWindow:
        type: boolean
    type: object
  models.GraphData:
    properties:
      edges:
        items:
          $ref: '#/definitions/models.GraphEdge'
        type: array
      nodes:
        items:
          $ref: '#/definitions/models.GraphNode'
        type: array
    type: object
  models.GraphEdge:
    properties:
      source:
        type: string
      target:
        type: string
    type: object
  models.GraphNode:
    properties:
      blockCount:
        type: integer
      errorCount:
        type: integer
      id:
        type: string
      label:
        type: string
      type:
        description: '"subflow"'
        type: string
      warnCount:
        type: integer
    type: object
  models.Highlight:
    properties:
      end:
        type: integer
      start:
        type: integer
    type: object
  models.LayoutSettings:
    properties:
      inspectorCollapsed:
        type: boolean
      inspectorWidth:
        type: integer
      lastActiveInspectorTab:
        type: string
      lastViewMode:
        type: string
      sidebarCollapsed:
        type: boolean
      sidebarWidth:
        type: integer
    type: object
  models.ModelDetail:
    properties:
      contextLimit:
        type: integer
      displayName:
        type: string
      id:
        type: string
      inputCostPerM:
        type: number
      outputCostPerM:
        type: number
    type: object
  models.ParseError:
    properties:
      column:
        type: integer
      line:
        type: integer
      message:
        type: string
      severity:
        type: string
      snippet:
        type: string
    type: object
  models.ParserSettings:
    properties:
      maxFileSizeMB:
        type: integer
      preserveComments:
        type: boolean
      spacesPerIndent:
        type: integer
      treatTabsAsSpaces:
        type: boolean
    type: object
  models.ProviderInfo:
    properties:
      authType:
        type: string
      configured:
        type: boolean
      contextLimit:
        type: integer
      defaultModel:
        type: string
      id:
        type: string
      models:
        items:
          $ref: '#/definitions/models.ModelDetail'
        type: array
      name:
        type: string
    type: object
  models.ProviderTestResult:
    properties:
      error:
        type: string
      latencyMs:
        type: integer
      ok:
        type: boolean
    type: object
  models.RecentFile:
    properties:
      isFolder:
        type: boolean
      lastOpen:
        type: string
      name:
        type: string
      path:
        type: string
      size:
        type: integer
    type: object
  models.Rule:
    properties:
      category:
        type: string
      defaultSeverity:
        $ref: '#/definitions/models.Severity'
      description:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
    type: object
  models.RuleConfig:
    properties:
      enabled:
        type: boolean
      options:
        additionalProperties: true
        type: object
      severity:
        type: string
    type: object
  models.SearchQuery:
    properties:
      blockTypes:
        items:
          $ref: '#/definitions/models.BlockType'
        type: array
      fuzzy:
        type: boolean
      maxResults:
        type: integer
      text:
        type: string
    type: object
  models.SearchResult:
    properties:
      blockId:
        type: string
      highlights:
        items:
          $ref: '#/definitions/models.Highlight'
        type: array
      matchedField:
        type: string
      matchedText:
        type: string
      score:
        type: integer
      subflowId:
        type: string
    type: object
  models.SearchResults:
    properties:
      durationMs:
        type: integer
      query:
        $ref: '#/definitions/models.SearchQuery'
      results:
        items:
          $ref: '#/definitions/models.SearchResult'
        type: array
      totalCount:
        type: integer
    type: object
  models.Severity:
    enum:
    - error
    - warning
    - info
    type: string
    x-enum-varnames:
    - SeverityError
    - SeverityWarning
    - SeverityInfo
  models.Subflow:
    properties:
      blocks:
        items:
          $ref: '#/definitions/models.Block'
        type: array
      id:
        type: string
      name:
        type: string
      sourceFile:
        description: file name (without path) this subflow was parsed from
        type: string
      variables:
        items:
          $ref: '#/definitions/models.VariableDecl'
        type: array
    type: object
  models.SubflowDiff:
    properties:
      blocks:
        items:
          $ref: '#/definitions/models.BlockDiff'
        type: array
      change:
        $ref: '#/definitions/models.ChangeType'
      name:
        type: string
    type: object
  models.ThemeMode:
    enum:
    - dark
    - light
    - system
    - midnight
    - warm
    - tokyo-night
    - one-dark
    - dracula
    - nord
    type: string
    x-enum-varnames:
    - ThemeDark
    - ThemeLight
    - ThemeSystem
    - ThemeMidnight
    - ThemeWarm
    - ThemeTokyoNight
    - ThemeOneDark
    - ThemeDracula
    - ThemeNord
  models.VariableDecl:
    properties:
      initialValue:
        type: string
      name:
        type: string
      scope:
        type: string
      type:
        type: string
    type: object
  models.VariableEvent:
    properties:
      blockId:
        type: string
      line:
        type: integer
      subflowId:
        type: string
      type:
        description: '"init", "mutate", "read"'
        type: string
    type: object
  models.VariableHistory:
    properties:
      events:
        items:
          $ref: '#/definitions/models.VariableEvent'
        type: array
      name:
        type: string
    type: object
info:
  contact: {}
  description: This is the API for the Pad Analyzer project.
  title: Pad Analyzer API
  version: '1.0'
paths:
  /api/admin/migration/start:
    post:
      description: "Kicks off the local\u2192database flow migration (admin only, cloud mode). Idempotent and non-blocking."
      produces:
      - application/json
      responses:
        '202':
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        '403':
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        '409':
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start data migration
      tags:
      - admin
  /api/admin/migration/status:
    get:
      description: Returns the status/result of the most recent data migration (admin only).
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            additionalProperties: true
            type: object
        '403':
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Data migration status
      tags:
      - admin
  /api/admin/users/list:
    get:
      description: Returns a list of all registered users. Only available to system admins.
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            items:
              $ref: '#/definitions/interfaces.User'
            type: array
        '401':
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        '403':
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        '500':
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all users
      tags:
      - admin
  /api/admin/users/{userId}/role:
    put:
      consumes:
      - application/json
      description: Updates the system role for a specific user. Only available to system admins.
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      - description: Set Role Request
        in: body
        name: request
        required: true
        schema:
          properties:
            role:
              type: string
          type: object
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        '400':
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        '401':
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        '403':
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        '404':
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        '500':
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set user role
      tags:
      - admin
  /api/analysis/analyze:
    post:
      description: Runs all enabled analysis rules on the current flow document.
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/models.AnalysisReport'
        '500':
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Analyze current flow
      tags:
      - analysis
  /api/analysis/baseline/clear:
    post:
      consumes:
      - application/json
      description: Clear the baseline for a flow
      produces:
      - application/json
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '503':
          description: Service Unavailable (cloud mode required)
      summary: Clear the baseline for a flow
      tags:
      - baseline
  /api/analysis/baseline/drift:
    post:
      consumes:
      - application/json
      description: Compare current analysis against the baseline
      produces:
      - application/json
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '503':
          description: Service Unavailable (cloud mode required)
      summary: Compare current analysis against the baseline
      tags:
      - baseline
  /api/analysis/baseline/get:
    post:
      consumes:
      - application/json
      description: Get the baseline snapshot for a flow
      produces:
      - application/json
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '503':
          description: Service Unavailable (cloud mode required)
      summary: Get the baseline snapshot for a flow
      tags:
      - baseline
  /api/analysis/baseline/set:
    post:
      consumes:
      - application/json
      description: Set the current analysis as the baseline
      produces:
      - application/json
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '503':
          description: Service Unavailable (cloud mode required)
      summary: Set the current analysis as the baseline
      tags:
      - baseline
  /api/analysis/comments/add:
    post:
      consumes:
      - application/json
      description: Add a comment to a finding
      produces:
      - application/json
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '503':
          description: Service Unavailable (cloud mode required)
      summary: Add a comment to a finding
      tags:
      - comments
  /api/analysis/comments/delete:
    post:
      consumes:
      - application/json
      description: Delete a comment
      produces:
      - application/json
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '503':
          description: Service Unavailable (cloud mode required)
      summary: Delete a comment
      tags:
      - comments
  /api/analysis/comments/list:
    post:
      consumes:
      - application/json
      description: List comments for a finding
      produces:
      - application/json
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '503':
          description: Service Unavailable (cloud mode required)
      summary: List comments for a finding
      tags:
      - comments
  /api/analysis/export/csv:
    post:
      consumes:
      - application/json
      description: Export findings as CSV
      produces:
      - application/json
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '503':
          description: Service Unavailable (cloud mode required)
      summary: Export findings as CSV
      tags:
      - export
  /api/analysis/export/junit:
    post:
      consumes:
      - application/json
      description: Export analysis results as JUnit XML
      produces:
      - application/json
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '503':
          description: Service Unavailable (cloud mode required)
      summary: Export analysis results as JUnit XML
      tags:
      - export
  /api/analysis/graph:
    post:
      description: Returns a graph representation of the flow's execution path.
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/models.GraphData'
        '500':
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get execution graph
      tags:
      - analysis
  /api/analysis/lineage:
    post:
      consumes:
      - application/json
      description: Returns the history and dependencies of a specific variable within the flow.
      parameters:
      - description: Variable Lineage Request
        in: body
        name: request
        required: true
        schema:
          properties:
            varName:
              type: string
          type: object
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/models.VariableHistory'
        '400':
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        '500':
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get variable lineage
      tags:
      - analysis
  /api/analysis/policy/delete:
    post:
      consumes:
      - application/json
      description: Delete a policy
      produces:
      - application/json
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '503':
          description: Service Unavailable (cloud mode required)
      summary: Delete a policy
      tags:
      - policy
