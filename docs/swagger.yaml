  /api/integrations/ci:
    post:
      consumes:
      - application/json
      description: 'Analyzes a stored flow for a CI runner. Authenticated by an HMAC-SHA256
        of "<X-Baki-Timestamp>." + body under PAD_CI_WEBHOOK_SECRET, sent as X-Baki-Signature:
        sha256=<hex>; the timestamp must be within 5 minutes. Body: {flowId, failOn,
        format}. failOn is error (default), warning, info or none; findings of preview
        rules never fail the gate and are counted in `preview`. format "summary" (default)
        returns {flowId, flowName, passed, gate, errors, warnings, info, preview},
        "report" adds the findings, "sarif" returns the SARIF 2.1.0 document instead
        (application/sarif+json).'
      parameters:
      - description: '{flowId, failOn, format}'
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      - application/sarif+json
      responses:
        "200":
          description: Gate verdict, or the SARIF document
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Missing or invalid signature or timestamp
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Flow not found
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Body over 1 MiB
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: PAD_CI_WEBHOOK_SECRET not set
          schema:
            additionalProperties:
              type: string
            type: object
      summary: CI webhook
      tags:
      - analysis
