  /api/analysis/analyze-raw:
    post:
      consumes:
      - application/json
      description: 'handleAnalyzeRaw analyzes raw PAD flow text WITHOUT requiring
        a pre-stored flow, so CI pipelines and wrappers can POST flow text and get
        findings back in one call — no library upload, no Go CLI install. Works in
        both modes (auth via PAT in cloud; open in local). Body: {files, name, format?}
        where format is "json" (default: the analysis report), "sarif" (SARIF 2.1.0),
        "junit" (JUnit XML) or "csv"; those three are sent as an attachment named
        pad-analysis.<ext>. At most 50 files and 2048 KB in total. Nothing is persisted.'
      parameters:
      - description: '{files: {name: source}, name, format}'
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      - application/sarif+json
      - application/xml
      - text/csv
      responses:
        "200":
          description: Analysis report (json), or the SARIF, JUnit or CSV document
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request (no files, unknown format, parse failure)
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Too many files or payload too large
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Analyze raw PAD source
      tags:
      - analysis
