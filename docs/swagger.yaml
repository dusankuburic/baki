  /api/chat/save:
    post:
      consumes:
      - application/json
      description: 'Saves the chat history for a specific flow and provider. A message''s
        modelLabel (the model''s display name when it was sent) is stored clamped:
        NFC-normalised, control, bidi and zero-width characters dropped, whitespace
        collapsed, at most 64 characters.'
      parameters:
      - description: request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Save conversation history
      tags:
      - chat
  /api/chat/stream:
    post:
      consumes:
      - application/json
      description: 'Initiates a streaming chat session with an AI provider. The answer
        arrives on the event stream as chunk, tool, tool_result, done and error events.
        The done payload carries tokensIn, tokensOut and chunks, plus — when known
        — servedModel (the model that answered an alias such as an Azure AI Foundry
        deployment, router or agent) and inputCostPerM / outputCostPerM (the per-million-token
        rates the turn was billed at). An error payload carries message and, when
        classified, code (AI_BUDGET_EXCEEDED, PROVIDER_AUTH, PROVIDER_PERMISSION,
        PROVIDER_NOT_CONFIGURED, MODEL_NOT_AVAILABLE, …). For provider azure-foundry
        the model is a model registry id ("m/<entryId>"; "" for the server default;
        a pre-registry deployment, "claude:" or "agent:" id still resolves for one
        release): one the caller cannot use — removed, another owner''s, no longer
        shared with them — is refused before any stream starts with 400 and code MODEL_NOT_AVAILABLE.'
      parameters:
      - description: request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Stream ID
          schema:
            type: string
        "400":
          description: 'Bad Request (code MODEL_NOT_AVAILABLE: the Azure AI Foundry
            model is not available to the caller)'
          schema:
            $ref: '#/definitions/render.ErrorResponse'
        "429":
          description: Too many concurrent chat streams (code CHAT_CAPACITY_REACHED)
          schema:
            $ref: '#/definitions/render.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Stream chat message
      tags:
      - chat
