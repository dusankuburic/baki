  /api/orgs/{id}/knowledge/reindex:
    post:
      consumes:
      - application/json
      description: 'Re-embeds every knowledge chunk with the caller''s embedding provider
        — the recovery path after switching embedding provider/model, which strands
        the existing corpus at the old dimension (searches silently return nothing).
        When the corpus was indexed with a different embedding model at the same width,
        the request is refused with 409 EMBEDDING_MODEL_CHANGED unless the body sets
        "force": true — re-indexing switches every document to the caller''s model,
        and members whose embedding provider uses another model stop receiving the
        org''s guidelines.'
      parameters:
      - description: Org ID
        in: path
        name: id
        required: true
        type: string
      - description: Optional. force=true re-indexes even when the corpus was indexed
          with a different embedding model (first request of a run only); cursor =
          the previous answer's nextCursor resumes the run after it
        in: body
        name: request
        schema:
          $ref: '#/definitions/api.knowledgeReindexRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Re-indexed this request''s pages ({chunks, docs}); nextCursor
            (with truncated=true) means chunks remain — post again with {force, cursor:
            nextCursor}. Every page is committed as it completes, so a later failure
            keeps the earlier pages — a request that FAILS after committing pages
            answers its error code with details {nextCursor, chunks} to resume from'
          schema:
            $ref: '#/definitions/rag.ReindexResult'
        "400":
          description: Embedding provider not configured (EMBEDDING_NOT_CONFIGURED;
            EMBEDDING_ORG_NOT_CONFIGURED when the org's shared Azure credential names
            no embedding deployment), rejected credentials (EMBEDDING_AUTH_FAILED,
            EMBEDDING_PERMISSION_DENIED), a request the provider rejected (EMBEDDING_PROVIDER_REJECTED)
            or malformed body / cursor
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 'Embedding model differs from the indexed corpus (EMBEDDING_MODEL_CHANGED;
            resend with force — on a resumed request: the caller''s model is not the
            one the run converted to) or another upload/re-index of this org is in
            flight (KNOWLEDGE_BUSY)'
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Embedding provider throttled the request (EMBEDDING_RATE_LIMITED)
            or the daily AI budget is spent (BUDGET_EXCEEDED)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Embedding provider unavailable (EMBEDDING_PROVIDER_UNAVAILABLE)
            or the budget could not be checked (BUDGET_UNAVAILABLE)
          schema:
            additionalProperties:
              type: string
            type: object
        "504":
          description: The request's deadline ran out before a page was committed
            (KNOWLEDGE_TIMEOUT)
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Re-index org knowledge base
      tags:
      - org
  /api/orgs/{id}/knowledge/upload:
